name: Apply corrected dual cleanup delivery

on:
  pull_request:
    branches:
      - Rebuild_website
    paths:
      - '.github/delivery/corrected_payload_trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Decode and verify corrected payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/delivery/corrected_payload.part-* | base64 -d > /tmp/dual_cleanup_payload.tar.gz
          echo '5cc763eba15761f3fd8a15543dcd20bdf60b4df068e4940c99a6388add1bbe96  /tmp/dual_cleanup_payload.tar.gz' | sha256sum -c -
          mkdir -p /tmp/dual-cleanup
          tar -xzf /tmp/dual_cleanup_payload.tar.gz -C /tmp/dual-cleanup

      - name: Switch to latest target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Rebuild_website
          git checkout -B delivery-target origin/Rebuild_website

      - name: Apply final clean dual-portal source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/dual-cleanup/files/ ./
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rm -f -- "$path"
          done < /tmp/dual-cleanup/deletions.txt
          rm -f .github/delivery/dual_cleanup_payload.b64
          rm -f .github/delivery/dual_cleanup_payload.part-*
          rm -f .github/delivery/dual_cleanup_pr_trigger.txt
          rm -f .github/workflows/apply-dual-cleanup.yml
          rmdir .github/delivery 2>/dev/null || true

      - name: Run dual runtime guard
        run: python3 scripts/implementation/dual_runtime_guard.py

      - name: Run Phase 08 portal contract
        run: python3 scripts/implementation/phase08_portal_contract.py

      - name: Run Authz module contract
        run: python3 scripts/implementation/authz_module_contract.py

      - name: Commit and push final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(platform): finalize clean dual-portal runtime and authz'
          git push origin HEAD:Rebuild_website

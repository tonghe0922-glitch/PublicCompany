name: Phase 07 Independent Formal Gate

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase07-formal-gate.yml"
      - "docs/implementation/MASTER_PROGRESS.md"
      - "docs/implementation/phases/PHASE-07/**"
      - "scripts/implementation/phase07_design_system_contract.py"
      - "scripts/implementation/phase07_frontend_quality.py"
      - "technical-platform/web/src/design-system/**"
      - "technical-platform/web/src/platform/PlatformShell.vue"
      - "technical-platform/web/src/platform/AuthenticatedPortalLayout.vue"
      - "technical-platform/web/src/styles.css"
      - "technical-platform/web/e2e/**"
      - "technical-platform/web/eslint.config.js"
      - "technical-platform/web/.jscpd.json"
      - "technical-platform/web/knip.json"
      - "technical-platform/web/playwright.config.ts"
      - "technical-platform/web/vite.config.ts"
      - "technical-platform/web/package.json"
      - "technical-platform/web/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase07-formal-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-source-review:
    name: Independent source scope safety and adequacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify ancestry phase boundary and complete contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          REWORK_BASE=f26b12ecdcc37400e12808f2df56eff901ef0864
          git merge-base --is-ancestor "$REWORK_BASE" HEAD
          grep -q '| PHASE-07 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-08 \| (NOT_STARTED|IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          git diff --check "$REWORK_BASE"..HEAD
          python -m py_compile scripts/implementation/phase07_design_system_contract.py scripts/implementation/phase07_frontend_quality.py
          python scripts/implementation/phase07_design_system_contract.py --stage complete
          python scripts/implementation/phase07_frontend_quality.py --stage source
      - name: Reject fake completion secrets and later-phase coupling
        shell: bash
        run: |
          set -euo pipefail
          TARGET=technical-platform/web/src/design-system
          BAD='TODO|FIXME|mock|fake|demo|hardcode|localStorage|sessionStorage|catch[[:space:]]*\{[[:space:]]*\}|@ts-ignore|@ts-nocheck|:[[:space:]]*any\b|as[[:space:]]+any\b|\.skip\(|describe\.skip|it\.skip|test\.skip|disabled test|临时账号|测试验证码|默认密码|临时演示入口'
          if grep -R -nEi "$BAD" "$TARGET"; then exit 1; fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "$TARGET"; then exit 1; fi
          if grep -R -nE '/api/|\bP[0-9]{3}\b|\bfetch[[:space:]]*\(|\baxios\b' "$TARGET"; then exit 1; fi
      - name: Enforce AGENT Vue template complexity ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('technical-platform/web/src/design-system')
          failures = []
          for path in root.rglob('*.vue'):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'<template>(.*?)</template>', text, re.S)
              if not match:
                  failures.append(f'{path}: missing template')
                  continue
              effective = [line for line in match.group(1).splitlines() if line.strip() and not line.strip().startswith('<!--')]
              if len(effective) > 180:
                  failures.append(f'{path}: template effective lines={len(effective)} > 180')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Vue template complexity ceiling PASS')
          PY
      - name: Require VTU browser smoke and full form family
        shell: bash
        run: |
          set -euo pipefail
          test -f technical-platform/web/src/design-system/component-vtu.test.ts
          grep -q "from '@vue/test-utils'" technical-platform/web/src/design-system/component-vtu.test.ts
          test -f technical-platform/web/e2e/design-system-integration.spec.ts
          for name in DateTime Checkbox RadioGroup Switch Upload Cascader PersonPicker OrganizationPicker Avatar PersonRow RecordCard KpiCard ToastRegion; do
            test -f "technical-platform/web/src/design-system/components/${name}.vue"
          done
          grep -q 'SgjPortalShell' technical-platform/web/src/platform/AuthenticatedPortalLayout.vue

  independent-static-quality:
    name: Independent ESLint duplication and dead-code rerun
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm quality:duplicates
      - run: pnpm quality:deadcode

  independent-web-browser-rerun:
    name: Independent typecheck VTU build artifact and Playwright rerun
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm quality:artifacts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase07-formal-evidence-${{ github.sha }}
          path: |
            technical-platform/web/dist
            technical-platform/web/reports
          if-no-files-found: warn

  formal-verdict:
    name: PHASE-07 independent formal verdict
    if: always()
    needs: [independent-source-review, independent-static-quality, independent-web-browser-rerun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every hard gate and completed phase state
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.independent-source-review.result }}' = 'success'
          test '${{ needs.independent-static-quality.result }}' = 'success'
          test '${{ needs.independent-web-browser-rerun.result }}' = 'success'
          grep -q '| PHASE-07 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-08 \| (NOT_STARTED|IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          echo 'PHASE-07 regression gate: PASS'

name: PHASE-11 Current Source Export

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-source-export-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export exact PHASE-11 branch source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          test "$GITHUB_REF_NAME" = "agent/phase-11-performance-growth-welfare"
          git status --short
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-current-source-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

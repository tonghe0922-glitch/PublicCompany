name: Temporary repository snapshot

on:
  push:
    branches:
      - 'agent/dual-portal-snapshot'
  pull_request:
    branches:
      - 'Rebuild_website'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source tree
        run: tar --exclude=.git -czf repository-snapshot.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: repository-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error

name: Harden S8020 Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/s8020-clean-baseline
    paths:
      - .github/workflows/harden-s8020-baseline.yml
      - pom.xml

permissions:
  contents: write

concurrency:
  group: harden-s8020-baseline
  cancel-in-progress: true

jobs:
  harden-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out remediated source
        uses: actions/checkout@v5
        with:
          ref: refactor/s8020-clean-baseline
          fetch-depth: 0

      - name: Apply deterministic Java warning fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java_files = list(Path('technical-platform/backend').rglob('*.java'))
          mockbean_count = 0
          for path in java_files:
              text = path.read_text(encoding='utf-8')
              original = text
              if 'org.springframework.boot.test.mock.mockito.MockBean' in text:
                  text = text.replace(
                      'import org.springframework.boot.test.mock.mockito.MockBean;',
                      'import org.springframework.test.context.bean.override.mockito.MockitoBean;',
                  )
                  text = text.replace('@MockBean', '@MockitoBean')
                  mockbean_count += 1
              if text != original:
                  path.write_text(text, encoding='utf-8')

          runtime_path = Path(
              'technical-platform/backend/modules/workflow/src/main/java/'
              'cn/shangjingu/platform/workflow/WorkflowRuntimeService.java'
          )
          runtime = runtime_path.read_text(encoding='utf-8')
          old_runtime = 'node.fields().forEachRemaining(entry -> fields.put(entry.getKey(), entry.getValue()));'
          new_runtime = 'node.properties().forEach(entry -> fields.put(entry.getKey(), entry.getValue()));'
          if old_runtime not in runtime:
              raise SystemExit('Expected deprecated JsonNode.fields() call was not found')
          runtime_path.write_text(runtime.replace(old_runtime, new_runtime), encoding='utf-8')

          lifecycle_path = Path(
              'technical-platform/backend/modules/workflow/src/test/java/'
              'cn/shangjingu/platform/workflow/phase11/Phase11LifecycleServiceTest.java'
          )
          lifecycle = lifecycle_path.read_text(encoding='utf-8')
          old_lifecycle = '''when(transactions.required(any(DatabaseSecurityContext.class), any(Supplier.class)))
                .thenAnswer(invocation -> ((Supplier<?>) invocation.getArgument(1)).get());'''
          new_lifecycle = '''when(transactions.required(
                        any(DatabaseSecurityContext.class),
                        org.mockito.ArgumentMatchers.<Supplier<Object>>any()))
                .thenAnswer(invocation -> invocation.<Supplier<?>>getArgument(1).get());'''
          if old_lifecycle not in lifecycle:
              raise SystemExit('Expected raw Supplier matcher was not found')
          lifecycle_path.write_text(
              lifecycle.replace(old_lifecycle, new_lifecycle),
              encoding='utf-8',
          )

          print(f'Updated deprecated @MockBean usage in {mockbean_count} Java file(s).')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply full-source Java hygiene
        shell: bash
        run: bash ./mvnw -B -ntp spotless:apply

      - name: Run all backend tests and quality checks
        shell: bash
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api,technical-platform/backend/apps/worker -am test

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: bash
        working-directory: technical-platform/web
        run: pnpm install --frozen-lockfile

      - name: Run frontend static quality gates
        shell: bash
        working-directory: technical-platform/web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm quality:duplicates
          NODE_OPTIONS=--max-old-space-size=4096 pnpm quality:deadcode

      - name: Run frontend unit tests
        shell: bash
        working-directory: technical-platform/web
        run: pnpm test

      - name: Build work and tech ports
        shell: bash
        working-directory: technical-platform/web
        run: pnpm build

      - name: Validate Docker Compose configuration
        shell: bash
        run: docker compose --env-file .env.example -f docker/compose/docker-compose.dev.yml config >/tmp/s8020-compose.yml

      - name: Verify no legacy warning patterns remain
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.java' \
              'org.springframework.boot.test.mock.mockito.MockBean\|@MockBean\|node\.fields()' \
              technical-platform/backend; then
            echo 'Legacy Java warning patterns remain.' >&2
            exit 1
          fi
          grep -q '<id>java-source-hygiene</id>' pom.xml
          ! grep -q 'phase10-java-format-ratchet' pom.xml

      - name: Remove one-time hardening workflow
        shell: bash
        run: |
          rm -f .github/workflows/harden-s8020-baseline.yml
          git add -A
          git diff --cached --check

      - name: Commit verified quality hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: harden Java quality gates and remove warnings"
          git push origin HEAD:refactor/s8020-clean-baseline

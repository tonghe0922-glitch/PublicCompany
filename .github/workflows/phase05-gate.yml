name: Phase 05 Independent Gate

# Push is restricted to this workflow file so environments without workflow-dispatch
# write capability can execute the same exact-SHA Gate without auto-gating ordinary code pushes.
on:
  push:
    branches: [ChatGPT_Version_V0.05]
    paths:
      - ".github/workflows/phase05-gate.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact READY_FOR_GATE commit SHA to revalidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase05-independent-gate-${{ github.event.inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  PUBLICCOMPANY_IMPORT_BASE: fb6c818faec2a9bb521ae13a777477650f551f8d
  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || github.sha }}

jobs:
  gate-preflight:
    name: Exact candidate source scope and security preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Bind Gate to exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          grep -q '> Repository: `tonghe0922-glitch/PublicCompany`' docs/implementation/MASTER_PROGRESS.md
          grep -q '> Construction branch: `ChatGPT_Version_V0.05`' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-04 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-05 | READY_FOR_GATE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-06 | NOT_STARTED |' docs/implementation/MASTER_PROGRESS.md
          grep -q 'Current canonical Gate state: `READY_TO_RUN / NOT_RUN`' docs/implementation/phases/PHASE-05/PHASE_GATE.md
          grep -q 'PHASE GATE: NOT_RUN' docs/implementation/phases/PHASE-05/PHASE_GATE.md
          python scripts/implementation/phase05_source_contract.py --check
          remote_sha="$(git ls-remote origin refs/heads/ChatGPT_Version_V0.05 | cut -f1)"
          test -n "$remote_sha"
          test "$remote_sha" = "$CANDIDATE_SHA"
      - name: Verify canonical source boundary and final evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PUBLICCOMPANY_IMPORT_BASE" HEAD -- AGENT.md DESIGN.md "Knowledge Base"
          git diff --check "$PUBLICCOMPANY_IMPORT_BASE" HEAD
          for path in \
            docs/implementation/phases/PHASE-05/SOURCE_CONTRACT.md \
            docs/implementation/phases/PHASE-05/IMPACT_MATRIX.md \
            docs/implementation/phases/PHASE-05/GAP_MATRIX.md \
            docs/implementation/phases/PHASE-05/PHASE_REPORT.md \
            docs/implementation/phases/PHASE-05/PHASE_GATE.md \
            docs/implementation/phases/PHASE-05/C3_CHECKPOINT.md \
            docs/implementation/phases/PHASE-05/C4_CHECKPOINT.md \
            docs/implementation/phases/PHASE-05/C5_CHECKPOINT.md \
            docs/implementation/phases/PHASE-05/C6_CHECKPOINT.md \
            docs/implementation/phases/PHASE-05/C7_CHECKPOINT.md \
            docs/implementation/phases/PHASE-05/C8_CHECKPOINT.md \
            docs/implementation/contracts/phase-05/WORKFLOW_API.md \
            technical-platform/backend/modules/database-baseline/src/test/java/cn/shangjingu/platform/database/Phase05WorkflowFinalDatabaseIT.java; do
            test -s "$path"
          done
          grep -q 'Phase05WorkflowFinalDatabaseIT.java' technical-platform/backend/modules/database-baseline/pom.xml
          grep -q '31250129581' docs/implementation/phases/PHASE-05/C8_CHECKPOINT.md
          grep -q '31249831710' docs/implementation/phases/PHASE-05/C7_CHECKPOINT.md
          grep -q 'Historical independent run: 31239820134' docs/implementation/phases/PHASE-05/PHASE_GATE.md
      - name: Reject fake completion bypasses and committed token secrets
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(technical-platform/backend technical-platform/web/src)
          if grep -R -nE 'TODO|FIXME|@Disabled|@Ignore|@ts-ignore|@ts-nocheck|localStorage|sessionStorage|默认密码|测试验证码|临时演示入口' "${TARGETS[@]}"; then
            echo 'Forbidden fake-completion shortcut found'
            exit 1
          fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "${TARGETS[@]}"; then
            echo 'Potential committed token secret found'
            exit 1
          fi
          if grep -R -nE 'flyway-core|flyway-database-postgresql' technical-platform/backend/apps/api/pom.xml technical-platform/backend/apps/worker/pom.xml; then
            echo 'Runtime POM must not own Flyway migration capability'
            exit 1
          fi

  java-api-regression:
    name: Independent Java and Workflow API regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - name: Full Java regression
        run: bash ./mvnw -B -ntp test
      - name: Build API dependencies
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
      - name: Re-run Workflow controller and Spring Security contract
        run: >-
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api
          -Dtest=WorkflowRuntimeControllerTest,WorkflowApiSecurityTest test

  postgres-workflow-regression:
    name: PostgreSQL 16 canonical workflow RLS concurrency and history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - name: Re-run complete PHASE-05 PostgreSQL 16 suite
        run: >-
          bash ./mvnw -B -ntp -am
          -pl technical-platform/backend/modules/database-baseline
          -Pphase05-integration verify

  phase04-security-regression:
    name: PHASE-04 IAM Redis HTTP and immutable-audit regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - name: Re-run IAM directory session RBAC ABAC field Step-Up integration
        run: >-
          bash ./mvnw -B -ntp -pl technical-platform/backend/modules/iam
          -am -Pphase04-integration verify
      - name: Build API dependencies without duplicate upstream integration
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
      - name: Re-run HTTP 401 403 switch expiry logout and immutable-audit integration
        run: >-
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api
          -Pphase04-integration verify

  web-regression:
    name: Independent completed Web regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows-regression:
    name: Windows Chinese-path completed-stage script regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Copy candidate into Chinese path
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP '中文路径\PublicCompany'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $target -Recurse -Force
          }
          "PHASE05_GATE_CHINESE_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run install verify migrate start stop contracts
        shell: cmd
        run: |
          cd /d "%PHASE05_GATE_CHINESE_PATH%"
          call scripts\windows\install.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\verify.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\migrate.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\start.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\stop.bat --ci
          if errorlevel 1 exit /b 1

  formal-gate:
    name: PHASE-05 formal gate verdict
    if: always()
    needs:
      - gate-preflight
      - java-api-regression
      - postgres-workflow-regression
      - phase04-security-regression
      - web-regression
      - windows-regression
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent Gate job to pass
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.gate-preflight.result }}' = 'success'
          test '${{ needs.java-api-regression.result }}' = 'success'
          test '${{ needs.postgres-workflow-regression.result }}' = 'success'
          test '${{ needs.phase04-security-regression.result }}' = 'success'
          test '${{ needs.web-regression.result }}' = 'success'
          test '${{ needs.windows-regression.result }}' = 'success'
          echo 'Candidate: $CANDIDATE_SHA'
          echo 'PHASE GATE: PASS'

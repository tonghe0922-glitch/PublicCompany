name: Phase 03 Flyway Generate

on:
  push:
    branches:
      - agent/full-build
    paths:
      - "Knowledge Base/03 数据库需求规则/03_SQL_DDL/**"
      - "scripts/implementation/phase03_prepare_flyway.py"
      - "scripts/implementation/phase03_flyway_compat.py"
      - ".github/workflows/phase03-flyway-generate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase03-flyway-generate-agent-full-build
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic Flyway baseline with explicit psql compatibility
        run: python scripts/implementation/phase03_flyway_compat.py
      - name: Verify deterministic regeneration
        run: python scripts/implementation/phase03_flyway_compat.py --check
      - name: Validate generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff --quiet -- AGENT.md DESIGN.md "Knowledge Base" || {
            echo "Canonical source changed during Flyway generation"
            exit 1
          }
      - name: Persist generated Flyway baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-platform/database/flyway
          if git diff --cached --quiet; then
            echo "PHASE-03 Flyway baseline already current"
            exit 0
          fi
          git commit -m "phase-03: regenerate Flyway compatibility baseline"
          git fetch origin agent/full-build
          git rebase origin/agent/full-build
          python scripts/implementation/phase03_flyway_compat.py --check
          git push origin HEAD:agent/full-build

name: PHASE-11 P013 Web Diagnose

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-p013-web-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-11-performance-growth-welfare
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - name: Generate P013 web candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/implementation/phase11_p013_generate_backend.py
          python scripts/implementation/phase11_p013_generate_database.py
          python scripts/implementation/phase11_p013_generate_web.py
      - name: Run web gates and emit concise evidence
        working-directory: technical-platform/web
        shell: bash
        run: |
          set -uo pipefail
          pnpm install --frozen-lockfile >/tmp/install.log 2>&1
          echo "INSTALL_RC=$?"
          for gate in typecheck lint test quality:duplicates quality:deadcode build; do
            echo "===== GATE=$gate ====="
            set +e
            if [ "$gate" = "quality:deadcode" ]; then
              NODE_OPTIONS=--max-old-space-size=4096 pnpm "$gate" >"/tmp/${gate//:/_}.log" 2>&1
            else
              pnpm "$gate" >"/tmp/${gate//:/_}.log" 2>&1
            fi
            rc=$?
            set -e
            echo "RC=$rc"
            grep -nEi 'error TS|error |ERR_|FAIL|failed|AssertionError|duplicate|unused|unreferenced|not exported|not found|Cannot find|does not exist|no-unused|Parsing error|BUILD (SUCCESS|FAILURE)' "/tmp/${gate//:/_}.log" | tail -n 260 || true
            if [ "$rc" -ne 0 ]; then
              echo '----- LOG TAIL -----'
              tail -n 260 "/tmp/${gate//:/_}.log" || true
              break
            fi
          done
          exit 0

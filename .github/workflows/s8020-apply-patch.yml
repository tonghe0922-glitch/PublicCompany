name: Apply S8020 Clean-Baseline Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out clean-baseline branch
        uses: actions/checkout@v4
        with:
          ref: refactor/s8020-clean-baseline
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          cat .tmp/s8020-patch/part-* > /tmp/s8020-fix.patch
          printf '%s  %s\n' \
            '452336c2a097b85c6b9f710c818f800fb1a191c2c4b0a5aabdba14ec256c7969' \
            '/tmp/s8020-fix.patch' | sha256sum --check --strict

      - name: Apply refactor atomically
        shell: bash
        run: |
          git apply --index --whitespace=nowarn /tmp/s8020-fix.patch
          git rm -f technical-platform/web/src/router/generated/portal-ia-navigation.json
          git rm -rf .tmp/s8020-patch
          git rm -f .github/workflows/s8020-source-export.yml
          git diff --cached --check

      - name: Commit and push refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: establish two-port clean baseline'
          git push origin HEAD:refactor/s8020-clean-baseline

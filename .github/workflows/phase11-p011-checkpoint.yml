name: PHASE-11 P011 Checkpoint

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-c0.yml"
      - ".github/workflows/phase11-p011-checkpoint.yml"
      - "docs/implementation/contracts/phase-11/**"
      - "docs/implementation/phases/PHASE-11/**"
      - "scripts/implementation/phase11_c0_contract.py"
      - "scripts/implementation/phase11_p011_contract.py"
      - "technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11/**"
      - "technical-platform/backend/apps/api/src/test/java/cn/shangjingu/platform/api/phase11/**"
      - "technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/security/SecurityConfiguration.java"
      - "technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/phase11/**"
      - "technical-platform/backend/modules/workflow/src/test/java/cn/shangjingu/platform/workflow/phase11/**"
      - "technical-platform/backend/modules/database-baseline/pom.xml"
      - "technical-platform/backend/modules/database-baseline/src/test/java/cn/shangjingu/platform/database/Phase11P011DatabaseIT.java"
      - "technical-platform/database/flyway-overlays/oms/V122__phase11_p011_performance.sql"
      - "technical-platform/web/src/platform/phase11/**"
      - "technical-platform/web/src/platform/pages/phase11/**"
      - "technical-platform/web/src/router/portal-route-specs.ts"
      - "technical-platform/web/src/router/p011-router.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-p011-${{ github.ref }}
  cancel-in-progress: false

env:
  PHASE11_C0_SHA: 5c4b3d75fe3afab86f3b83f5fdf5a2f70870f724

jobs:
  contract:
    name: P011 C0, scope and repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify repository and frozen C0 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          test "$GITHUB_REF_NAME" = "agent/phase-11-performance-growth-welfare"
          python scripts/implementation/phase11_repository_identity.py
          python scripts/implementation/phase11_c0_contract.py
          python scripts/implementation/phase11_p011_contract.py
          git diff --check "$PHASE11_C0_SHA"...HEAD
      - name: Reject P012+ executable construction and PHASE-12 drift
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(technical-platform/backend technical-platform/web/src technical-platform/web/e2e technical-platform/database)
          ADDED=$(git diff -U0 "$PHASE11_C0_SHA"...HEAD -- "${TARGETS[@]}" | grep '^+' | grep -v '^+++' || true)
          if printf '%s\n' "$ADDED" | grep -Eq '\bP0(12|13|14|15|16|17|18|19|20)\b|\bPHASE-12\b'; then
            echo 'P011 checkpoint introduced later checkpoint or PHASE-12 executable coupling'
            exit 1
          fi
          if printf '%s\n' "$ADDED" | grep -Ei 'CREATE TABLE[^;]*(phase[_-]?11|p011)'; then
            echo 'P011 shadow business table is forbidden; use canonical table plus additive fact tables'
            exit 1
          fi
          if grep -R -nEi 'TODO|FIXME|@ts-ignore|@ts-nocheck|localStorage.*P011|mock.*P011|bypass login' "${TARGETS[@]}"; then
            exit 1
          fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "${TARGETS[@]}"; then
            exit 1
          fi

  backend-unit:
    name: Java 21 P011 application and API behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend unit tests
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am test
      - name: Require P011 tests explicitly
        run: >-
          bash ./mvnw -B -ntp
          -pl technical-platform/backend/apps/api -am
          -Dtest=Phase11ProcessContractTest,PerformanceServiceMappingTest,Phase11LifecycleServiceTest,Phase11ApiExceptionHandlerTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  api-security-regression:
    name: PHASE-04 API security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run PostgreSQL 16 API integration regression
        shell: bash
        run: |
          set -o pipefail
          if ! bash ./mvnw -B -ntp -e -pl technical-platform/backend/apps/api -am -Pphase04-integration verify 2>&1 | tee /tmp/phase11-p011-api.log; then
            find . -type f \( -path '*/surefire-reports/*' -o -path '*/failsafe-reports/*' \) -print | sort | while read -r report; do
              echo "===== $report ====="
              tail -n 220 "$report" || true
            done
            grep -nEi 'BUILD FAILURE|ERROR|Caused by:|Flyway|Migration|PSQLException|SQLException|AssertionFailedError' /tmp/phase11-p011-api.log | tail -n 320 || true
            exit 1
          fi

  database:
    name: PostgreSQL 16 P011 canonical facts and immutability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run P011 database integration profile
        shell: bash
        run: |
          set -o pipefail
          if ! bash ./mvnw -B -ntp -e -pl technical-platform/backend/modules/database-baseline -am -Pphase11-p011-integration verify 2>&1 | tee /tmp/phase11-p011-db.log; then
            find . -type f \( -path '*/surefire-reports/*' -o -path '*/failsafe-reports/*' \) -print | sort | while read -r report; do
              echo "===== $report ====="
              tail -n 260 "$report" || true
            done
            grep -nEi 'BUILD FAILURE|ERROR|Caused by:|Flyway|Migration|PSQLException|SQLException|AssertionFailedError|SQLSTATE' /tmp/phase11-p011-db.log | tail -n 380 || true
            exit 1
          fi

  web:
    name: P011 Vue TypeScript lint unit quality and three builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm quality:duplicates
      - run: pnpm quality:deadcode
      - run: pnpm build

  verdict:
    name: P011 checkpoint verdict
    if: always()
    needs: [contract, backend-unit, api-security-regression, database, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every P011 checkpoint job green
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.contract.result }}" = success
          test "${{ needs.backend-unit.result }}" = success
          test "${{ needs.api-security-regression.result }}" = success
          test "${{ needs.database.result }}" = success
          test "${{ needs.web.result }}" = success

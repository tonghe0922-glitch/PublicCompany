name: PHASE-09 Preparation Gate

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase09-preparation-gate.yml"
      - "scripts/implementation/phase09_preparation_extract.py"
      - "scripts/implementation/phase09_page_trace.py"
      - "docs/implementation/phases/PHASE-09/**"
      - "docs/implementation/MASTER_PROCESS_CATALOG.json"
      - "docs/implementation/MASTER_PAGE_CATALOG.json"
      - "docs/implementation/contracts/phase-01/pages.json"
      - "docs/implementation/contracts/phase-01/api_records.jsonl"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase09-preparation-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparation-contract:
    name: PHASE-09 deterministic source and preparation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify phase boundary and source snapshots
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "louthison/PublicCompany"
          grep -q '| PHASE-08 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-09 \| (NOT_STARTED|IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          python -m py_compile scripts/implementation/phase09_preparation_extract.py scripts/implementation/phase09_page_trace.py
          python scripts/implementation/phase09_preparation_extract.py --check
          python scripts/implementation/phase09_page_trace.py --check
          test -s docs/implementation/phases/PHASE-09/PREPARATION_REPORT.md
          test -s docs/implementation/phases/PHASE-09/SOURCE_CONTRACT_DRAFT.md
          test -s docs/implementation/phases/PHASE-09/IMPACT_MATRIX_DRAFT.md
          test -s docs/implementation/phases/PHASE-09/GAP_MATRIX_DRAFT.md
          test -s docs/implementation/phases/PHASE-09/START_CHECKLIST.md
          git diff --check
      - name: Enforce lifecycle-appropriate completion policy
        shell: bash
        run: |
          set -euo pipefail
          MASTER=docs/implementation/MASTER_PROGRESS.md
          PHASE_DIR=docs/implementation/phases/PHASE-09

          if grep -q '| PHASE-09 | COMPLETE |' "$MASTER"; then
            # After formal closeout, the preparation gate becomes a frozen-source
            # regression gate. It must prove that closeout evidence exists instead
            # of incorrectly requiring the phase to remain IN_PROGRESS forever.
            grep -q 'COMPLETE / FULL_CONSTRUCTION_GATE_PASS' "$PHASE_DIR/README.md"
            test -s "$PHASE_DIR/PHASE_REPORT.md"
            test -s "$PHASE_DIR/PHASE_GATE.md"
            grep -q 'PHASE-09: COMPLETE' "$PHASE_DIR/PHASE_GATE.md" || \
              grep -q 'PHASE-09 = COMPLETE' "$PHASE_DIR/PHASE_GATE.md"
            grep -q '| PHASE-10 | NOT_STARTED |' "$MASTER"
            for process in P001 P002 P003 P004 P005; do
              test -s "$PHASE_DIR/${process}_CHECKPOINT.md"
            done
            echo 'PHASE-09 preparation sources remain deterministic after formal closeout'
          else
            # Before closeout, retain the original anti-fake-completion behavior.
            if grep -R -nE '\bP00[1-5]\b.{0,120}\bIMPLEMENTED\b' technical-platform/web/src technical-platform/backend/apps/api/src/main/java technical-platform/backend/modules; then
              echo 'PHASE-09 preparation must not claim P001-P005 IMPLEMENTED in executable source'
              exit 1
            fi
            grep -Eq 'PREPARATION_(ONLY|READY) / NOT_STARTED' "$PHASE_DIR/README.md" || \
              grep -q '| PHASE-09 | IN_PROGRESS |' "$MASTER"
          fi

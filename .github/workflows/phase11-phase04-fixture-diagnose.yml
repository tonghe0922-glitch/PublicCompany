name: PHASE-11 P012 Spring Proxy Repair

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-phase04-fixture-diagnose.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: phase11-p012-spring-proxy-repair
  cancel-in-progress: false

env:
  OFFICIAL_BRANCH: agent/phase-11-performance-growth-welfare

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase-11-performance-growth-welfare
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make the Spring repository proxyable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/phase11/PromotionRepository.java')
          text = path.read_text(encoding='utf-8')
          old = 'public final class PromotionRepository {'
          new = 'public class PromotionRepository {'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one final PromotionRepository declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -n 'public class PromotionRepository' technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/phase11/PromotionRepository.java
          git diff --check
          python scripts/implementation/phase11_p011_contract.py
          python scripts/implementation/phase11_p012_contract.py
      - name: Verify Java and full PHASE-04 API security regression
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am test
          bash ./mvnw -B -ntp -e \
            -pl technical-platform/backend/apps/api -am \
            -Pphase04-integration verify
      - name: Commit the production fix and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase11-phase04-fixture-diagnose.yml
          git add technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/phase11/PromotionRepository.java
          git diff --cached --check
          git commit -m "fix: allow Spring to proxy P012 promotion repository"
          git push origin HEAD:"$OFFICIAL_BRANCH"
      - name: Dispatch the formal P012 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run phase11-p012-checkpoint.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$OFFICIAL_BRANCH"

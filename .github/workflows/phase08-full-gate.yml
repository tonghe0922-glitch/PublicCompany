name: PHASE-08 Full Construction Gate

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase08-full-gate.yml"
      - ".github/workflows/phase08-portal-runtime.yml"
      - "docs/implementation/MASTER_PROGRESS.md"
      - "docs/implementation/MASTER_TRACEABILITY.md"
      - "docs/implementation/MASTER_API_CATALOG.md"
      - "docs/implementation/MASTER_PERMISSION_MATRIX.md"
      - "docs/implementation/MASTER_DATABASE_MAPPING.md"
      - "docs/implementation/MASTER_GAPS.md"
      - "docs/implementation/phases/PHASE-08/**"
      - "scripts/implementation/phase08_*.py"
      - "technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/security/**"
      - "technical-platform/backend/apps/api/src/test/java/cn/shangjingu/platform/api/**"
      - "docs/implementation/contracts/phase-04/openapi.yaml"
      - "technical-platform/web/src/**"
      - "technical-platform/web/e2e/**"
      - "technical-platform/web/eslint.config.js"
      - "technical-platform/web/.jscpd.json"
      - "technical-platform/web/knip.json"
      - "technical-platform/web/playwright*.config.ts"
      - "technical-platform/web/vite.config.ts"
      - "technical-platform/web/tsconfig*.json"
      - "technical-platform/web/package.json"
      - "technical-platform/web/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase08-full-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-scope:
    name: PHASE-08 source scope and contract regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify source contracts and completed-phase boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '| PHASE-07 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-08 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-09 \| (NOT_STARTED|IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-10 | NOT_STARTED |' docs/implementation/MASTER_PROGRESS.md
          python -m py_compile scripts/implementation/phase08_page_ia_extract.py scripts/implementation/phase08_navigation_extract.py scripts/implementation/phase08_c0_contract.py scripts/implementation/phase08_portal_contract.py
          python scripts/implementation/phase08_page_ia_extract.py --check
          python scripts/implementation/phase08_navigation_extract.py --check
          python scripts/implementation/phase08_c0_contract.py
          python scripts/implementation/phase08_portal_contract.py --stage c7
          git diff --check
      - name: Reject credentials and next-phase coupling
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(technical-platform/web/src technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/security)
          BAD='TODO|FIXME|@ts-ignore|@ts-nocheck|默认密码|测试验证码|临时演示入口|临时账号|demo password|bypass login'
          if grep -R -nEi "$BAD" "${TARGETS[@]}"; then exit 1; fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "${TARGETS[@]}"; then exit 1; fi
          NEXT_PHASE_TARGETS=(technical-platform/web/src technical-platform/backend/apps/api/src/main/java)
          if grep -R -nE '\bP00(6|7|8|9)\b|\bP010\b' "${NEXT_PHASE_TARGETS[@]}"; then
            echo 'PHASE-10 executable coupling leaked while PHASE-09 is active'
            exit 1
          fi

  static-web:
    name: PHASE-08 strict static unit build artifact and browser regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm quality:duplicates
      - run: pnpm quality:deadcode
      - run: pnpm build
      - run: pnpm quality:artifacts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase08-static-web-${{ github.sha }}
          path: |
            technical-platform/web/dist
            technical-platform/web/reports
          if-no-files-found: warn

  backend-regression:
    name: PHASE-08 real PostgreSQL Redis IAM regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run API unit contracts
        run: |
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api test
      - name: Re-run PostgreSQL16 Redis7.4 IAM integration
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -Pphase04-integration verify

  live-browser-integration:
    name: Browser Vite proxy Spring Boot PostgreSQL Redis audit closed loop
    runs-on: ubuntu-latest
    env:
      PHASE08_E2E_TENANT: PHASE08_E2E
      PHASE08_E2E_LOGIN: phase08.e2e.user
      SJG_LOCAL_API_PROXY_TARGET: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - name: Generate ephemeral synthetic browser credential
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="S08_$(openssl rand -hex 18)"
          echo "::add-mask::$PASSWORD"
          echo "PHASE08_E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Compile backend browser fixture and resolve test classpath
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api test-compile
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api dependency:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/technical-platform/backend/apps/api/target/phase08-classpath.txt"
      - name: Install browser dependencies
        working-directory: technical-platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start real Spring Boot PostgreSQL Redis fixture
        shell: bash
        run: |
          set -euo pipefail
          API_DIR=technical-platform/backend/apps/api
          CP="$API_DIR/target/test-classes:$API_DIR/target/classes:$(cat "$API_DIR/target/phase08-classpath.txt")"
          java -cp "$CP" cn.shangjingu.platform.api.Phase08BrowserBackendFixture > "$API_DIR/target/phase08-fixture.log" 2>&1 &
          echo $! > "$API_DIR/target/phase08-fixture.pid"
          for attempt in $(seq 1 120); do
            if grep -q 'PHASE08_BROWSER_FIXTURE_READY' "$API_DIR/target/phase08-fixture.log" && curl -sS http://127.0.0.1:18080/actuator/health >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$API_DIR/target/phase08-fixture.pid")" 2>/dev/null; then
              cat "$API_DIR/target/phase08-fixture.log"; exit 1
            fi
            sleep 2
          done
          cat "$API_DIR/target/phase08-fixture.log"; exit 1
      - name: Run live three-portal session browser E2E
        working-directory: technical-platform/web
        run: pnpm exec playwright test --config=playwright.phase08-live.config.ts
      - name: Verify immutable audit effects and credential redaction
        shell: bash
        run: |
          set -euo pipefail
          FACTS=technical-platform/backend/apps/api/target/phase08-fixture-runtime.json
          test -s "$FACTS"
          PG_CONTAINER=$(jq -r '.postgresContainerId' "$FACTS")
          TENANT_ID=$(jq -r '.tenantId' "$FACTS")
          ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action in ('LOGIN_SUCCESS','SESSION_REFRESH','SESSION_SWITCH','SESSION_LOGOUT')")
          SWITCHES=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='SESSION_SWITCH'")
          DENIED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.security_event where tenant_id='$TENANT_ID'::uuid and event_type='AUTHORIZATION_DENIED'")
          CREDENTIAL_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select (select count(*) from audit.operation_log where row_to_json(operation_log)::text like '%$PHASE08_E2E_PASSWORD%') + (select count(*) from audit.security_event where row_to_json(security_event)::text like '%$PHASE08_E2E_PASSWORD%')")
          test "$ACTIONS" -ge 12
          test "$SWITCHES" -ge 1
          test "$DENIED" -ge 1
          test "$CREDENTIAL_HITS" -eq 0
          printf 'audit actions=%s switches=%s denied=%s credential_hits=%s\n' "$ACTIONS" "$SWITCHES" "$DENIED" "$CREDENTIAL_HITS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase08-live-browser-${{ github.sha }}
          path: |
            technical-platform/web/reports/playwright-phase08-live
            technical-platform/backend/apps/api/target/phase08-fixture.log
          if-no-files-found: warn
      - name: Stop live fixture
        if: always()
        shell: bash
        run: |
          PID_FILE=technical-platform/backend/apps/api/target/phase08-fixture.pid
          if [ -s "$PID_FILE" ]; then
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
            wait "$(cat "$PID_FILE")" 2>/dev/null || true
          fi

  full-verdict:
    name: PHASE-08 C7 construction verdict
    if: always()
    needs: [source-scope, static-web, backend-regression, live-browser-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all PHASE-08 construction gates
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.source-scope.result }}' = 'success'
          test '${{ needs.static-web.result }}' = 'success'
          test '${{ needs.backend-regression.result }}' = 'success'
          test '${{ needs.live-browser-integration.result }}' = 'success'
          echo 'PHASE-08 C7 regression: PASS'

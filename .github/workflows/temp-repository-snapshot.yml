name: Apply verified dual-portal migration

on:
  push:
    branches:
      - agent/dual-portal-snapshot

permissions:
  contents: write

concurrency:
  group: dual-portal-migration-rebuild-website
  cancel-in-progress: false

jobs:
  migrate-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve program and switch to target
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/temporary/apply_dual_portal_v2.py
          cp scripts/temporary/apply_dual_portal_v2.py /tmp/apply_dual_portal_v2.py
          git fetch origin Rebuild_website
          git checkout -B dual-portal-work origin/Rebuild_website

      - name: Apply and guard
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_dual_portal_v2.py
          python scripts/implementation/dual_portal_guard.py
          git diff --check
          if git status --porcelain | sed 's/^...//' | grep -E '^(Knowledge Base/|technical-platform/api/|technical-platform/(database|db|worker|integrations)/|database/)'; then
            echo 'Immutable Knowledge Base/backend/database content was modified.' >&2
            exit 1
          fi

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml

      - name: Install and validate frontend
        working-directory: technical-platform/web
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run build
          test -d dist/work
          test -d dist/admin
          test ! -d dist/employee
          test ! -d dist/center

      - name: Publish Rebuild_website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'refactor(platform): consolidate runtime into work and tech portals'
          git push origin HEAD:Rebuild_website

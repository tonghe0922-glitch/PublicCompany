name: PHASE-11 P012 Rebuild Check

on:
  push:
    branches: [agent/phase-11-p012-rebuild]
    paths:
      - ".github/workflows/phase11-p012-rebuild-check.yml"
      - "technical-platform/backend/**"
      - "technical-platform/database/**"
      - "technical-platform/web/**"
      - "scripts/implementation/phase11_p012_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-p012-rebuild
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am test

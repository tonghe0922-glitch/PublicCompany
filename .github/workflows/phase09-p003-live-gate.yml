name: PHASE-09 P003 Live Gate

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase09-p003-live-gate.yml"
      - "technical-platform/backend/apps/api/src/test/java/cn/shangjingu/platform/api/Phase09P003BrowserBackendFixture.java"
      - "technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase09/P003ProfileChangeController.java"
      - "technical-platform/backend/modules/hr/**"
      - "technical-platform/backend/apps/worker/src/main/java/cn/shangjingu/platform/worker/Phase09P003NotificationHandler.java"
      - "technical-platform/database/flyway-overlays/oms/V110__phase09_p003_profile_change.sql"
      - "technical-platform/web/src/platform/pages/P003ProfileChangePage.vue"
      - "technical-platform/web/src/router/portal-router.ts"
      - "technical-platform/web/e2e/phase09-p003-live.spec.ts"
      - "technical-platform/web/playwright.phase09-p003-live.config.ts"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: phase09-p003-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p003-live-browser:
    name: P003 real profile workflow PostgreSQL Redis three-portal E2E
    runs-on: ubuntu-latest
    env:
      PHASE09_P003_TENANT: PHASE09_P003_E2E
      PHASE09_P003_LOGIN: phase09.p003.applicant
      P003_SYNTHETIC_ID: TESTP003ID00001234
      SJG_LOCAL_API_PROXY_TARGET: http://127.0.0.1:18083
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - name: Generate ephemeral P003 credentials and profile encryption key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="S09P003_$(openssl rand -hex 18)"
          PROFILE_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$PROFILE_KEY"
          echo "PHASE09_P003_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "PHASE09_P003_PROFILE_KEY=$PROFILE_KEY" >> "$GITHUB_ENV"
      - name: Compile P003 live fixture and resolve test classpath
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api test-compile
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api dependency:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/technical-platform/backend/apps/api/target/phase09-p003-classpath.txt"
      - name: Install P003 browser dependencies
        working-directory: technical-platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start real P003 Spring Boot PostgreSQL Redis fixture
        shell: bash
        run: |
          set -euo pipefail
          API_DIR=technical-platform/backend/apps/api
          CP="$API_DIR/target/test-classes:$API_DIR/target/classes:$(cat "$API_DIR/target/phase09-p003-classpath.txt")"
          java -cp "$CP" cn.shangjingu.platform.api.Phase09P003BrowserBackendFixture > "$API_DIR/target/phase09-p003-fixture.log" 2>&1 &
          echo $! > "$API_DIR/target/phase09-p003-fixture.pid"
          for attempt in $(seq 1 120); do
            if grep -q 'PHASE09_P003_BROWSER_FIXTURE_READY' "$API_DIR/target/phase09-p003-fixture.log" && curl -sS http://127.0.0.1:18083/actuator/health >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$API_DIR/target/phase09-p003-fixture.pid")" 2>/dev/null; then
              cat "$API_DIR/target/phase09-p003-fixture.log"; exit 1
            fi
            sleep 2
          done
          cat "$API_DIR/target/phase09-p003-fixture.log"; exit 1
      - name: Run P003 P3 encryption reviewer separation scope and three-portal browser E2E
        working-directory: technical-platform/web
        run: pnpm exec playwright test --config=playwright.phase09-p003-live.config.ts
      - name: Verify P003 PostgreSQL workflow master encryption outbox audit and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          FACTS=technical-platform/backend/apps/api/target/phase09-p003-fixture-runtime.json
          test -s "$FACTS"
          PG_CONTAINER=$(jq -r '.postgresContainerId' "$FACTS")
          REDIS_CONTAINER=$(jq -r '.redisContainerId' "$FACTS")
          TENANT_ID=$(jq -r '.tenantId' "$FACTS")
          APPLICANT_EMPLOYEE=$(jq -r '.applicantEmployeeId' "$FACTS")
          REQUEST_ID=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select id from hr.employee_profile_change where tenant_id='$TENANT_ID'::uuid and subject='P003 live P3 profile lifecycle' and not is_deleted")
          test -n "$REQUEST_ID"
          STATUS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select status from hr.employee_profile_change where id='$REQUEST_ID'::uuid")
          INSTANCE_ID=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select workflow_instance_id from hr.employee_profile_change where id='$REQUEST_ID'::uuid")
          WF_STATUS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select status from workflow.wf_instance where id='$INSTANCE_ID'::uuid")
          WF_START_ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code='START' and not is_deleted")
          WF_ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code<>'START' and not is_deleted")
          DISTINCT_REVIEWERS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(distinct operator_id) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and from_status in ('S04','S05') and action_code='APPROVE' and not is_deleted")
          OUTBOX_EVENTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from core.outbox_event where aggregate_id='$REQUEST_ID'::uuid and event_type='P003_PROFILE_CHANGE_EVENT' and not is_deleted")
          ITEM_ROWS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from hr.employee_profile_change_item where tenant_id='$TENANT_ID'::uuid and master_id='$REQUEST_ID'::uuid and field_code='id_no' and not is_deleted")
          ITEM_CIPHER=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select item_value_json->>'ciphertext' from hr.employee_profile_change_item where tenant_id='$TENANT_ID'::uuid and master_id='$REQUEST_ID'::uuid and field_code='id_no' and not is_deleted")
          ITEM_HASH=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select item_value_json->>'valueHash' from hr.employee_profile_change_item where tenant_id='$TENANT_ID'::uuid and master_id='$REQUEST_ID'::uuid and field_code='id_no' and not is_deleted")
          MASTER_CIPHER=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select id_no_cipher from org.employee where tenant_id='$TENANT_ID'::uuid and id='$APPLICANT_EMPLOYEE'::uuid and not is_deleted")
          MASTER_HASH=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select id_no_hash from org.employee where tenant_id='$TENANT_ID'::uuid and id='$APPLICANT_EMPLOYEE'::uuid and not is_deleted")
          EXPECTED_HASH=$(printf '%s' "$P003_SYNTHETIC_ID" | sha256sum | awk '{print $1}')
          ITEM_PLAINTEXT_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from hr.employee_profile_change_item where tenant_id='$TENANT_ID'::uuid and master_id='$REQUEST_ID'::uuid and row_to_json(employee_profile_change_item)::text like '%$P003_SYNTHETIC_ID%' and not is_deleted")
          REQUEST_PLAINTEXT_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from hr.employee_profile_change where tenant_id='$TENANT_ID'::uuid and id='$REQUEST_ID'::uuid and row_to_json(employee_profile_change)::text like '%$P003_SYNTHETIC_ID%' and not is_deleted")
          OUTBOX_PLAINTEXT_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from core.outbox_event where tenant_id='$TENANT_ID'::uuid and aggregate_id='$REQUEST_ID'::uuid and payload::text like '%$P003_SYNTHETIC_ID%' and not is_deleted")
          AUDIT_CREATED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P003_CREATED' and resource_id='$REQUEST_ID'::uuid")
          AUDIT_REVIEWED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P003_REVIEWED' and resource_id='$REQUEST_ID'::uuid")
          AUDIT_APPLIED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P003_APPLIED' and resource_id='$REQUEST_ID'::uuid")
          AUDIT_PLAINTEXT_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select (select count(*) from audit.operation_log where row_to_json(operation_log)::text like '%$P003_SYNTHETIC_ID%') + (select count(*) from audit.security_event where row_to_json(security_event)::text like '%$P003_SYNTHETIC_ID%')")
          PASSWORD_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select (select count(*) from audit.operation_log where row_to_json(operation_log)::text like '%$PHASE09_P003_PASSWORD%') + (select count(*) from audit.security_event where row_to_json(security_event)::text like '%$PHASE09_P003_PASSWORD%')")
          REDIS_KEYS=$(docker exec "$REDIS_CONTAINER" redis-cli DBSIZE | tr -d '\r')
          test "$STATUS" = '已关闭'
          test "$WF_STATUS" = 'COMPLETED'
          test "$WF_START_ACTIONS" -eq 1
          test "$WF_ACTIONS" -eq 6
          test "$DISTINCT_REVIEWERS" -eq 2
          test "$OUTBOX_EVENTS" -eq 6
          test "$ITEM_ROWS" -eq 1
          test -n "$ITEM_CIPHER"
          test "$ITEM_CIPHER" != "$P003_SYNTHETIC_ID"
          test -n "$MASTER_CIPHER"
          test "$MASTER_CIPHER" != "$P003_SYNTHETIC_ID"
          test "$ITEM_HASH" = "$EXPECTED_HASH"
          test "$MASTER_HASH" = "$EXPECTED_HASH"
          test "$ITEM_PLAINTEXT_HITS" -eq 0
          test "$REQUEST_PLAINTEXT_HITS" -eq 0
          test "$OUTBOX_PLAINTEXT_HITS" -eq 0
          test "$AUDIT_CREATED" -eq 1
          test "$AUDIT_REVIEWED" -ge 3
          test "$AUDIT_APPLIED" -eq 1
          test "$AUDIT_PLAINTEXT_HITS" -eq 0
          test "$PASSWORD_HITS" -eq 0
          test "$REDIS_KEYS" -ge 5
          printf 'request=%s status=%s workflow=%s start=%s actions=%s reviewers=%s outbox=%s item=%s audit=%s/%s/%s redis=%s\n' "$REQUEST_ID" "$STATUS" "$WF_STATUS" "$WF_START_ACTIONS" "$WF_ACTIONS" "$DISTINCT_REVIEWERS" "$OUTBOX_EVENTS" "$ITEM_ROWS" "$AUDIT_CREATED" "$AUDIT_REVIEWED" "$AUDIT_APPLIED" "$REDIS_KEYS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase09-p003-live-${{ github.sha }}
          path: |
            technical-platform/web/reports/playwright-phase09-p003-live
            technical-platform/backend/apps/api/target/phase09-p003-fixture.log
            technical-platform/backend/apps/api/target/phase09-p003-fixture-runtime.json
          if-no-files-found: warn
      - name: Stop P003 live fixture
        if: always()
        shell: bash
        run: |
          PID_FILE=technical-platform/backend/apps/api/target/phase09-p003-fixture.pid
          if [ -s "$PID_FILE" ]; then
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
            wait "$(cat "$PID_FILE")" 2>/dev/null || true
          fi

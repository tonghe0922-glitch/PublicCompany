name: Phase 08 Portal Runtime Construction

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase08-portal-runtime.yml"
      - ".github/workflows/phase08-c0-contract.yml"
      - "docs/implementation/MASTER_PROGRESS.md"
      - "docs/implementation/phases/PHASE-08/**"
      - "scripts/implementation/phase08_*.py"
      - "technical-platform/web/src/api/**"
      - "technical-platform/web/src/contracts/**"
      - "technical-platform/web/src/session/**"
      - "technical-platform/web/src/router/**"
      - "technical-platform/web/src/platform/**"
      - "technical-platform/web/src/portals/**"
      - "technical-platform/web/src/vue-shims.d.ts"
      - "technical-platform/web/e2e/**"
      - "technical-platform/web/knip.json"
      - "technical-platform/web/playwright.config.ts"
      - "technical-platform/web/playwright.phase08-live.config.ts"
      - "technical-platform/web/vite.config.ts"
      - "technical-platform/web/package.json"
      - "technical-platform/web/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase08-portal-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    name: PHASE-08 closeout source and phase-boundary regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify C7 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '| PHASE-07 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-08 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-09 \| (NOT_STARTED|IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-10 | NOT_STARTED |' docs/implementation/MASTER_PROGRESS.md
          python -m py_compile scripts/implementation/phase08_portal_contract.py scripts/implementation/phase08_navigation_extract.py
          python scripts/implementation/phase08_navigation_extract.py --check
          python scripts/implementation/phase08_portal_contract.py --stage c7
          git diff --check

  web-quality:
    name: PHASE-08 strict lint test build artifact and browser regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm quality:duplicates
      - run: pnpm quality:deadcode
      - run: pnpm build
      - run: pnpm quality:artifacts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase08-closeout-browser-evidence-${{ github.sha }}
          path: |
            technical-platform/web/dist
            technical-platform/web/reports
          if-no-files-found: warn

  checkpoint-verdict:
    name: PHASE-08 C7 portal-runtime regression verdict
    if: always()
    needs: [source-contract, web-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require C7 portal-runtime gates
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.source-contract.result }}' = 'success'
          test '${{ needs.web-quality.result }}' = 'success'
          echo 'PHASE-08 portal-runtime regression: PASS'

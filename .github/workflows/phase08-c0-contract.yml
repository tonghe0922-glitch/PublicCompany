name: Phase 08 C0 Contract Freeze

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase08-c0-contract.yml"
      - "scripts/implementation/phase08_c0_contract.py"
      - "scripts/implementation/phase08_page_ia_extract.py"
      - "docs/implementation/phases/PHASE-08/**"
      - "docs/implementation/contracts/phase-04/openapi.yaml"
      - "docs/implementation/MASTER_PROGRESS.md"
      - "technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/security/SessionController.java"
      - "technical-platform/backend/apps/api/src/test/java/cn/shangjingu/platform/api/security/SessionControllerContractTest.java"
      - "technical-platform/web/vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase08-c0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    name: C0 IAM source and contract regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Reparse and verify C0 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          grep -q '| PHASE-07 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-08 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-09 \| (NOT_STARTED|IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-10 | NOT_STARTED |' docs/implementation/MASTER_PROGRESS.md
          python -m py_compile scripts/implementation/phase08_page_ia_extract.py scripts/implementation/phase08_c0_contract.py
          python scripts/implementation/phase08_page_ia_extract.py --check
          python scripts/implementation/phase08_c0_contract.py
          git diff --check

  backend-contract:
    name: C0 IAM session server contract regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build API dependencies
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
      - name: Run API unit contract tests
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api test
      - name: Re-run real PostgreSQL Redis IAM security integration
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -Pphase04-integration verify

  web-regression:
    name: C0 frontend proxy type lint and three-portal build regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm quality:artifacts

  checkpoint-verdict:
    name: PHASE-08 C0 regression verdict
    if: always()
    needs: [source-contract, backend-contract, web-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Require all C0 hard gates
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.source-contract.result }}' = 'success'
          test '${{ needs.backend-contract.result }}' = 'success'
          test '${{ needs.web-regression.result }}' = 'success'
          echo 'PHASE-08 C0 regression: PASS'

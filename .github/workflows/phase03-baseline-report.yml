name: Phase 03 Database Baseline Report

on:
  push:
    branches:
      - agent/full-build
    paths:
      - "Knowledge Base/03 数据库需求规则/02_数据字典/03_全量表清单.csv"
      - "Knowledge Base/03 数据库需求规则/02_数据字典/06_索引设计.csv"
      - "Knowledge Base/03 数据库需求规则/03_SQL_DDL/**"
      - "scripts/implementation/phase03_database_baseline_report.py"
      - ".github/workflows/phase03-baseline-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase03-database-baseline-report-agent-full-build
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic database baseline report
        run: python scripts/implementation/phase03_database_baseline_report.py
      - name: Verify deterministic report
        run: python scripts/implementation/phase03_database_baseline_report.py --check
      - name: Validate report diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff --quiet -- AGENT.md DESIGN.md "Knowledge Base" || {
            echo "Canonical source changed while generating database baseline report"
            exit 1
          }
      - name: Persist baseline report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/phases/PHASE-03/DATABASE_BASELINE_REPORT.md docs/implementation/evidence/PHASE-03_STATIC_BASELINE.json
          if git diff --cached --quiet; then
            echo "PHASE-03 database baseline report already current"
            exit 0
          fi
          git commit -m "phase-03: generate database baseline report"
          git fetch origin agent/full-build
          git rebase origin/agent/full-build
          python scripts/implementation/phase03_database_baseline_report.py --check
          git push origin HEAD:agent/full-build

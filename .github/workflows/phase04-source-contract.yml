name: Phase 04 Source Contract

on:
  push:
    branches:
      - agent/full-build
    paths:
      - "scripts/implementation/phase04_source_contract.py"
      - "scripts/implementation/phase04_source_facts.py"
      - ".github/workflows/phase04-source-contract.yml"
      - "Knowledge Base/00 企业架构及员工/*.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/01_员工端/01_平台公共能力/001_统一登录与多岗位身份切换.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/01_员工端/01_平台公共能力/002_权限申请、复核与回收.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/01_员工端/01_平台公共能力/003_个人资料变更.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/02_中心管理端/01_平台公共能力/001_统一登录与多岗位身份切换.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/02_中心管理端/01_平台公共能力/002_权限申请、复核与回收.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/02_中心管理端/01_平台公共能力/003_个人资料变更.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/03_技术后台端/01_平台公共能力/001_统一登录与多岗位身份切换.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/03_技术后台端/01_平台公共能力/002_权限申请、复核与回收.xlsx"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/03_技术后台端/01_平台公共能力/003_个人资料变更.xlsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase04-source-contract-agent-full-build
  cancel-in-progress: false

jobs:
  parse-and-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify prior phase and source boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '| PHASE-03 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-04 \| (IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          git diff --quiet 6ac2c3e80c4f699d62c20e736026042dc58eb2c7 HEAD -- AGENT.md DESIGN.md "Knowledge Base"
      - name: Actually parse eleven PHASE-04 XLSX sources
        run: |
          python scripts/implementation/phase04_source_contract.py
          python scripts/implementation/phase04_source_facts.py
      - name: Verify deterministic evidence and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/implementation/phase04_source_contract.py --check
          python scripts/implementation/phase04_source_facts.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('docs/implementation/evidence/PHASE-04_SOURCE_CONTRACT.json').read_text(encoding='utf-8'))
          facts = json.loads(Path('docs/implementation/evidence/PHASE-04_IAM_SOURCE_FACTS.json').read_text(encoding='utf-8'))
          assert p['source_count'] == 11
          assert p['parse_failures'] == 0
          assert len(p['process_workbooks']) == 9
          assert p['privacy']['real_employee_values_in_output'] is False
          assert p['real_employee_workbook']['row_values_committed'] is False
          assert facts['real_employee_row_values_included'] is False
          assert len(facts['process_facts']) == 9
          for item in p['process_workbooks']:
              assert [s['sheet'] for s in item['sheets']] == p['expected_process_sheets']
              assert all(s['nonempty_row_count'] > 0 for s in item['sheets'])
          serialized = json.dumps(p['real_employee_workbook'], ensure_ascii=False)
          assert 'rows' not in p['real_employee_workbook']
          assert 'safe_rows' not in serialized
          print('11 XLSX sources parsed; compact IAM facts generated; real employee row values excluded')
          PY
          git diff --check
      - name: Persist focused source evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/implementation/evidence/PHASE-04_SOURCE_CONTRACT.json \
            docs/implementation/evidence/PHASE-04_IAM_SOURCE_FACTS.json \
            docs/implementation/phases/PHASE-04/SOURCE_CONTRACT.md \
            docs/implementation/phases/PHASE-04/IAM_SOURCE_FACTS.md
          if git diff --cached --quiet; then
            echo 'PHASE-04 source contract already current'
            exit 0
          fi
          git commit -m 'phase-04: generate focused IAM source facts'
          git fetch origin agent/full-build
          git rebase origin/agent/full-build
          python scripts/implementation/phase04_source_contract.py --check
          python scripts/implementation/phase04_source_facts.py --check
          git push origin HEAD:agent/full-build

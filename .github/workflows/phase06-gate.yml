name: Phase 06 Independent Gate

# Push is restricted to this workflow file so ordinary PHASE-06 construction commits do not auto-gate.
on:
  push:
    branches: [ChatGPT_Version_V0.05]
    paths:
      - ".github/workflows/phase06-gate.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact PHASE-06 READY_FOR_GATE commit SHA to revalidate
        required: true
        type: string

permissions: {contents: read}
concurrency:
  group: phase06-independent-gate-${{ github.event.inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  PUBLICCOMPANY_IMPORT_BASE: fb6c818faec2a9bb521ae13a777477650f551f8d
  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || github.sha }}

jobs:
  gate-preflight:
    name: Exact candidate source scope and security preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Bind Gate to exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          grep -q '| PHASE-05 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-06 | READY_FOR_GATE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-07 | NOT_STARTED |' docs/implementation/MASTER_PROGRESS.md
          grep -q 'Current Gate state: `READY_TO_RUN / NOT_RUN`' docs/implementation/phases/PHASE-06/PHASE_GATE.md
          grep -q 'PHASE GATE: NOT_RUN' docs/implementation/phases/PHASE-06/PHASE_GATE.md
          python scripts/implementation/phase05_source_contract.py --check
          python scripts/implementation/phase06_source_contract.py --check
          python scripts/implementation/phase06_final_gate_candidate.py --check
          remote_sha="$(git ls-remote origin refs/heads/ChatGPT_Version_V0.05 | cut -f1)"
          test -n "$remote_sha"
          test "$remote_sha" = "$CANDIDATE_SHA"
      - name: Verify immutable source boundary and safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PUBLICCOMPANY_IMPORT_BASE" HEAD -- AGENT.md DESIGN.md "Knowledge Base"
          # Construction Master Schedule.csv is a canonical GB18030 source whose imported lines already contain
          # trailing spaces. Its PHASE-06/13/14 semantics are parsed by phase06_final_gate_candidate.py above;
          # exclude only that known source from whitespace diagnostics while retaining import-base checks elsewhere.
          git diff --check "$PUBLICCOMPANY_IMPORT_BASE" HEAD -- . ':(exclude)Construction Master Schedule.csv'
          TARGETS=(technical-platform/backend technical-platform/web/src)
          if grep -R -nE 'TODO|FIXME|@Disabled|@Ignore|@ts-ignore|@ts-nocheck|localStorage|sessionStorage|默认密码|测试验证码|临时演示入口' "${TARGETS[@]}"; then exit 1; fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "${TARGETS[@]}"; then exit 1; fi
          if grep -R -nE 'flyway-core|flyway-database-postgresql' technical-platform/backend/apps/api/pom.xml technical-platform/backend/apps/worker/pom.xml; then exit 1; fi
  java-c7-security:
    name: Independent Java and C7 API Worker security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: bash ./mvnw -B -ntp test
      - run: bash ./mvnw -B -ntp -am -pl technical-platform/backend/apps/api,technical-platform/backend/apps/worker test
  postgres-phase06:
    name: PostgreSQL 16 PHASE-06 C2-C7 side-effect audit trace regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: bash ./mvnw -B -ntp -am -pl technical-platform/backend/modules/database-baseline -Pphase06-integration verify
  postgres-phase05:
    name: PostgreSQL 16 historical PHASE-05 canonical regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: bash ./mvnw -B -ntp -am -pl technical-platform/backend/modules/database-baseline -Pphase05-integration verify
  minio-regression:
    name: Independent real MinIO Document regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: bash ./mvnw -B -ntp -am -pl technical-platform/backend/modules/document -Pphase06-minio-integration verify
  phase04-security:
    name: PHASE-04 IAM Redis HTTP immutable audit regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: bash ./mvnw -B -ntp -pl technical-platform/backend/modules/iam -am -Pphase04-integration verify
      - run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
      - run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -Pphase04-integration verify
  web-regression:
    name: Independent completed Web regression
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: technical-platform/web}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm, cache-dependency-path: technical-platform/web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  windows-regression:
    name: Windows Chinese-path completed-stage script regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.CANDIDATE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Copy candidate into Chinese path
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP '中文路径\PublicCompany'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $target -Recurse -Force }
          "PHASE06_GATE_CHINESE_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run completed-stage scripts
        shell: cmd
        run: |
          cd /d "%PHASE06_GATE_CHINESE_PATH%"
          call scripts\windows\install.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\verify.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\migrate.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\start.bat --ci
          if errorlevel 1 exit /b 1
          call scripts\windows\stop.bat --ci
          if errorlevel 1 exit /b 1
  formal-gate:
    name: PHASE-06 formal gate verdict
    if: always()
    needs: [gate-preflight,java-c7-security,postgres-phase06,postgres-phase05,minio-regression,phase04-security,web-regression,windows-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent Gate job to pass
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.gate-preflight.result }}' = 'success'
          test '${{ needs.java-c7-security.result }}' = 'success'
          test '${{ needs.postgres-phase06.result }}' = 'success'
          test '${{ needs.postgres-phase05.result }}' = 'success'
          test '${{ needs.minio-regression.result }}' = 'success'
          test '${{ needs.phase04-security.result }}' = 'success'
          test '${{ needs.web-regression.result }}' = 'success'
          test '${{ needs.windows-regression.result }}' = 'success'
          echo "Candidate: $CANDIDATE_SHA"
          echo 'PHASE GATE: PASS'

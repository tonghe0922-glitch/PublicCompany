name: PHASE-11 P012 Route Apply

on:
  push:
    branches: [agent/phase-11-p012-rebuild]
    paths:
      - ".github/workflows/phase11-p012-route-apply.yml"
      - "scripts/implementation/apply_phase11_p012_routes.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-11-p012-rebuild
      - run: python3 scripts/implementation/apply_phase11_p012_routes.py
      - name: Commit route bindings
        run: |
          if git diff --quiet; then
            echo "P012 routes already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-platform/web/src/router/portal-route-specs.ts
          git commit -m "phase-11: bind frozen P012 portal routes"
          git push origin HEAD:agent/phase-11-p012-rebuild

name: PHASE-11 P013-P016 Schema Inspect

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-p013-p016-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase-11-performance-growth-welfare
      - name: Inspect finance authority and reusable integrations
        shell: bash
        run: |
          set -euo pipefail
          echo '===== FINANCE SCHEMAS AND TABLES ====='
          grep -R -nE --include='*.sql' 'CREATE (TABLE|SCHEMA).*finance|CREATE TABLE IF NOT EXISTS (finance|settlement|payment)\.' technical-platform/database | head -n 300 || true
          echo '===== PAYMENT / RECEIPT / INVOICE TABLES ====='
          grep -R -nEi --include='*.sql' 'CREATE TABLE IF NOT EXISTS [a-z_]+\.(.*payment|.*receipt|.*invoice|.*settlement|.*reimbursement)' technical-platform/database | head -n 400 || true
          echo '===== FINANCE CAPABILITY IMPLEMENTATIONS ====='
          grep -R -nE --include='*.java' 'FinanceCapability|validateBudgetInvoiceAndExecute|reconcile\(' technical-platform/backend | head -n 400 || true
          echo '===== FINANCE MODULE FILES ====='
          find technical-platform/backend -type f | grep -Ei '/finance/|Finance|Payment|Receipt|Invoice|Settlement' | sort | head -n 400 || true
          echo '===== API AUTHORIZATION TEST PATTERN ====='
          find technical-platform/backend/apps/api/src/test -type f -name '*SecurityTest.java' -o -name '*ContractTest.java' | sort | head -n 100
          echo '===== ROUTER PHASE11 BINDINGS ====='
          grep -nE 'P011|P012|/employee/03/03/05|/center/10/06/01|/tech/01/11/07' technical-platform/web/src/router/portal-route-specs.ts | head -n 240 || true
          echo '===== PACKAGE JSON SCRIPTS ====='
          cat technical-platform/web/package.json

name: PHASE-09 Full Construction Gate

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase09-full-gate.yml"
      - ".github/workflows/phase09-p003-live-gate.yml"
      - ".github/workflows/phase09-p004-live-gate.yml"
      - ".github/workflows/phase09-p005-live-gate.yml"
      - "docs/implementation/phases/PHASE-09/**"
      - "docs/implementation/contracts/phase-09/**"
      - "docs/implementation/MASTER_*.md"
      - "docs/implementation/MASTER_*_CATALOG.json"
      - "technical-platform/backend/**"
      - "technical-platform/database/flyway-overlays/oms/**"
      - "technical-platform/web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase09-full-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope-contract:
    name: PHASE-09 scope and source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify phase boundary and frozen C0 evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/implementation/phases/PHASE-09/IMPACT_MATRIX.md
          test -s docs/implementation/phases/PHASE-09/GAP_MATRIX.md
          test -s docs/implementation/phases/PHASE-09/P001_P005_SOURCE_SNAPSHOT.json
          test -s docs/implementation/contracts/phase-09/PHASE09_HTTP_PERMISSION_CONTRACT.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/implementation/phases/PHASE-09/P001_P005_SOURCE_SNAPSHOT.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['process_codes']==['P001','P002','P003','P004','P005']
          assert x['parse_failures']==0
          assert x['portal_count']==3 and x['process_count']==5
          assert x['nonempty_row_count']>=4396
          PY
          PHASE09_TARGETS=(
            technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase09
            technical-platform/backend/modules/iam/src/main/java/cn/shangjingu/platform/iam/mfa
            technical-platform/backend/modules/hr/src/main/java/cn/shangjingu/platform/hr/profile
            technical-platform/web/src/platform/pages
            technical-platform/web/src/router/portal-router.ts
            technical-platform/web/e2e/phase09-p001-live.spec.ts
            technical-platform/web/e2e/phase09-p002-live.spec.ts
            technical-platform/web/e2e/phase09-p003-live.spec.ts
            technical-platform/web/e2e/phase09-p004-live.spec.ts
            technical-platform/web/e2e/phase09-p005-live.spec.ts
          )
          if grep -R -nE '\bP00(6|7|8|9)\b|\bP010\b' "${PHASE09_TARGETS[@]}" 2>/dev/null; then
            echo 'Later-phase executable coupling found inside PHASE-09 implementation'
            exit 1
          fi
          git diff --check HEAD^
      - name: Reject credentials and bypass markers
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(technical-platform/backend technical-platform/web/src technical-platform/web/e2e/phase09-p001-live.spec.ts technical-platform/web/e2e/phase09-p002-live.spec.ts technical-platform/web/e2e/phase09-p003-live.spec.ts technical-platform/web/e2e/phase09-p004-live.spec.ts technical-platform/web/e2e/phase09-p005-live.spec.ts)
          if grep -R -nEi 'TODO|FIXME|@ts-ignore|@ts-nocheck|默认密码|测试验证码|临时演示入口|bypass login' "${TARGETS[@]}"; then exit 1; fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "${TARGETS[@]}"; then exit 1; fi

  backend:
    name: Java21 PostgreSQL Redis backend regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am test
      - name: Run real PostgreSQL16 Redis IAM integration profile
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -Pphase04-integration verify
      - name: Run PHASE-09 PostgreSQL16 worker and notification checkpoints
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/modules/database-baseline -am -Pphase09-integration verify

  web:
    name: Vue TypeScript unit build regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  p001-live-browser:
    name: P001 real MFA PostgreSQL Redis three-portal E2E
    runs-on: ubuntu-latest
    env:
      PHASE09_P001_TENANT: PHASE09_P001_E2E
      PHASE09_P001_LOGIN: phase09.p001.monitor
      SJG_LOCAL_API_PROXY_TARGET: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - name: Generate ephemeral P001 credentials and MFA encryption key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="S09_$(openssl rand -hex 18)"
          MFA_MASTER_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$MFA_MASTER_KEY"
          echo "PHASE09_P001_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "SJG_SECURITY_MFA_MASTER_KEY_BASE64=$MFA_MASTER_KEY" >> "$GITHUB_ENV"
      - name: Compile P001 live fixture and resolve test classpath
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api test-compile
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api dependency:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/technical-platform/backend/apps/api/target/phase09-p001-classpath.txt"
      - name: Install P001 browser dependencies
        working-directory: technical-platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start real P001 Spring Boot PostgreSQL Redis fixture
        shell: bash
        run: |
          set -euo pipefail
          API_DIR=technical-platform/backend/apps/api
          CP="$API_DIR/target/test-classes:$API_DIR/target/classes:$(cat "$API_DIR/target/phase09-p001-classpath.txt")"
          java -cp "$CP" cn.shangjingu.platform.api.Phase09P001BrowserBackendFixture > "$API_DIR/target/phase09-p001-fixture.log" 2>&1 &
          echo $! > "$API_DIR/target/phase09-p001-fixture.pid"
          for attempt in $(seq 1 120); do
            if grep -q 'PHASE09_P001_BROWSER_FIXTURE_READY' "$API_DIR/target/phase09-p001-fixture.log" && curl -sS http://127.0.0.1:18081/actuator/health >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$API_DIR/target/phase09-p001-fixture.pid")" 2>/dev/null; then
              cat "$API_DIR/target/phase09-p001-fixture.log"; exit 1
            fi
            sleep 2
          done
          cat "$API_DIR/target/phase09-p001-fixture.log"; exit 1
      - name: Run P001 MFA lifecycle permission scope and three-portal browser E2E
        working-directory: technical-platform/web
        run: pnpm exec playwright test --config=playwright.phase09-p001-live.config.ts
      - name: Verify P001 PostgreSQL Redis audit and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          FACTS=technical-platform/backend/apps/api/target/phase09-p001-fixture-runtime.json
          test -s "$FACTS"
          PG_CONTAINER=$(jq -r '.postgresContainerId' "$FACTS")
          REDIS_CONTAINER=$(jq -r '.redisContainerId' "$FACTS")
          TENANT_ID=$(jq -r '.tenantId' "$FACTS")
          MONITOR_USER=$(jq -r '.monitorUserId' "$FACTS")
          MFA_ROWS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from iam.mfa_credential where tenant_id='$TENANT_ID'::uuid and user_id='$MONITOR_USER'::uuid and method='TOTP'")
          MFA_ACTIVE=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from iam.mfa_credential where tenant_id='$TENANT_ID'::uuid and user_id='$MONITOR_USER'::uuid and method='TOTP' and status='ACTIVE'")
          MFA_LEVEL=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select mfa_level from iam.user_account where tenant_id='$TENANT_ID'::uuid and id='$MONITOR_USER'::uuid")
          REAUTH_SUCCESS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P001_REAUTH_SUCCESS'")
          MFA_CONFIRMED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P001_MFA_CONFIRMED'")
          MFA_DISABLED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P001_MFA_DISABLED'")
          SESSION_LISTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P001_SESSION_LIST'")
          REAUTH_REJECTED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.security_event where tenant_id='$TENANT_ID'::uuid and event_type='P001_REAUTH_REJECTED'")
          PASSWORD_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select (select count(*) from audit.operation_log where row_to_json(operation_log)::text like '%$PHASE09_P001_PASSWORD%') + (select count(*) from audit.security_event where row_to_json(security_event)::text like '%$PHASE09_P001_PASSWORD%')")
          REDIS_KEYS=$(docker exec "$REDIS_CONTAINER" redis-cli DBSIZE | tr -d '\r')
          test "$MFA_ROWS" -eq 1
          test "$MFA_ACTIVE" -eq 1
          test "$MFA_LEVEL" -eq 1
          test "$REAUTH_SUCCESS" -ge 3
          test "$MFA_CONFIRMED" -ge 2
          test "$MFA_DISABLED" -ge 1
          test "$SESSION_LISTS" -ge 5
          test "$REAUTH_REJECTED" -ge 1
          test "$PASSWORD_HITS" -eq 0
          test "$REDIS_KEYS" -ge 3
          printf 'mfa_rows=%s active=%s level=%s reauth=%s confirmed=%s disabled=%s session_lists=%s rejected=%s password_hits=%s redis_keys=%s\n' "$MFA_ROWS" "$MFA_ACTIVE" "$MFA_LEVEL" "$REAUTH_SUCCESS" "$MFA_CONFIRMED" "$MFA_DISABLED" "$SESSION_LISTS" "$REAUTH_REJECTED" "$PASSWORD_HITS" "$REDIS_KEYS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase09-p001-live-${{ github.sha }}
          path: |
            technical-platform/web/reports/playwright-phase09-p001-live
            technical-platform/backend/apps/api/target/phase09-p001-fixture.log
          if-no-files-found: warn
      - name: Stop P001 live fixture
        if: always()
        shell: bash
        run: |
          PID_FILE=technical-platform/backend/apps/api/target/phase09-p001-fixture.pid
          if [ -s "$PID_FILE" ]; then
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
            wait "$(cat "$PID_FILE")" 2>/dev/null || true
          fi

  p002-live-browser:
    name: P002 real permission workflow PostgreSQL Redis three-portal E2E
    runs-on: ubuntu-latest
    env:
      PHASE09_P002_TENANT: PHASE09_P002_E2E
      PHASE09_P002_LOGIN: phase09.p002.applicant
      SJG_LOCAL_API_PROXY_TARGET: http://127.0.0.1:18082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - name: Generate ephemeral P002 credentials and MFA encryption key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="S09P002_$(openssl rand -hex 18)"
          MFA_MASTER_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$MFA_MASTER_KEY"
          echo "PHASE09_P002_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "SJG_SECURITY_MFA_MASTER_KEY_BASE64=$MFA_MASTER_KEY" >> "$GITHUB_ENV"
      - name: Compile P002 live fixture and resolve test classpath
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api test-compile
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api dependency:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/technical-platform/backend/apps/api/target/phase09-p002-classpath.txt"
      - name: Install P002 browser dependencies
        working-directory: technical-platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start real P002 Spring Boot PostgreSQL Redis fixture
        shell: bash
        run: |
          set -euo pipefail
          API_DIR=technical-platform/backend/apps/api
          CP="$API_DIR/target/test-classes:$API_DIR/target/classes:$(cat "$API_DIR/target/phase09-p002-classpath.txt")"
          java -cp "$CP" cn.shangjingu.platform.api.Phase09P002BrowserBackendFixture > "$API_DIR/target/phase09-p002-fixture.log" 2>&1 &
          echo $! > "$API_DIR/target/phase09-p002-fixture.pid"
          for attempt in $(seq 1 120); do
            if grep -q 'PHASE09_P002_BROWSER_FIXTURE_READY' "$API_DIR/target/phase09-p002-fixture.log" && curl -sS http://127.0.0.1:18082/actuator/health >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$API_DIR/target/phase09-p002-fixture.pid")" 2>/dev/null; then
              cat "$API_DIR/target/phase09-p002-fixture.log"; exit 1
            fi
            sleep 2
          done
          cat "$API_DIR/target/phase09-p002-fixture.log"; exit 1
      - name: Run P002 high-risk reviewer separation idempotency scope and three-portal browser E2E
        working-directory: technical-platform/web
        run: pnpm exec playwright test --config=playwright.phase09-p002-live.config.ts
      - name: Verify P002 PostgreSQL workflow grant outbox audit and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          FACTS=technical-platform/backend/apps/api/target/phase09-p002-fixture-runtime.json
          test -s "$FACTS"
          PG_CONTAINER=$(jq -r '.postgresContainerId' "$FACTS")
          REDIS_CONTAINER=$(jq -r '.redisContainerId' "$FACTS")
          TENANT_ID=$(jq -r '.tenantId' "$FACTS")
          REQUEST_ID=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select id from iam.permission_request where tenant_id='$TENANT_ID'::uuid and subject='P002 live high-risk lifecycle' and not is_deleted")
          test -n "$REQUEST_ID"
          STATUS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select status from iam.permission_request where id='$REQUEST_ID'::uuid")
          GRANT_STATUS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select grant_status from iam.permission_request_grant where permission_request_id='$REQUEST_ID'::uuid")
          REVOKE_SOURCE=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select revoke_source from iam.permission_request_grant where permission_request_id='$REQUEST_ID'::uuid")
          USER_ROLE_ID=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select user_role_id from iam.permission_request_grant where permission_request_id='$REQUEST_ID'::uuid")
          ROLE_CLOSED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from iam.user_role where id='$USER_ROLE_ID'::uuid and grant_source='P002_PERMISSION_REQUEST' and effective_end_at is not null and effective_end_at <= now() and not is_deleted")
          INSTANCE_ID=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select workflow_instance_id from iam.permission_request where id='$REQUEST_ID'::uuid")
          WF_STATUS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select status from workflow.wf_instance where id='$INSTANCE_ID'::uuid")
          WF_START_ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code='START' and not is_deleted")
          WF_ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code<>'START' and not is_deleted")
          DISTINCT_APPROVERS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(distinct operator_id) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code in ('APPROVE','APPROVE_STANDARD','APPROVE_HIGH') and not is_deleted")
          OUTBOX_EVENTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from core.outbox_event where aggregate_id='$REQUEST_ID'::uuid and event_type='P002_PERMISSION_REQUEST_EVENT'")
          AUDIT_CREATED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P002_CREATED' and resource_id='$REQUEST_ID'::uuid")
          AUDIT_REVIEWED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P002_REVIEWED' and resource_id='$REQUEST_ID'::uuid")
          AUDIT_EXECUTED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P002_EXECUTED' and resource_id='$REQUEST_ID'::uuid")
          AUDIT_REVOKED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P002_REVOKED' and resource_id='$REQUEST_ID'::uuid")
          PASSWORD_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select (select count(*) from audit.operation_log where row_to_json(operation_log)::text like '%$PHASE09_P002_PASSWORD%') + (select count(*) from audit.security_event where row_to_json(security_event)::text like '%$PHASE09_P002_PASSWORD%')")
          REDIS_KEYS=$(docker exec "$REDIS_CONTAINER" redis-cli DBSIZE | tr -d '\r')
          test "$STATUS" = '已关闭'
          test "$GRANT_STATUS" = 'REVOKED'
          test "$REVOKE_SOURCE" = 'MANUAL'
          test -n "$USER_ROLE_ID"
          test "$ROLE_CLOSED" -eq 1
          test "$WF_STATUS" = 'COMPLETED'
          test "$WF_START_ACTIONS" -eq 1
          test "$WF_ACTIONS" -eq 7
          test "$DISTINCT_APPROVERS" -eq 3
          test "$OUTBOX_EVENTS" -eq 7
          test "$AUDIT_CREATED" -eq 1
          test "$AUDIT_REVIEWED" -ge 4
          test "$AUDIT_EXECUTED" -eq 1
          test "$AUDIT_REVOKED" -eq 1
          test "$PASSWORD_HITS" -eq 0
          test "$REDIS_KEYS" -ge 6
          printf 'request=%s status=%s grant=%s revoke_source=%s workflow=%s start_actions=%s business_actions=%s approvers=%s outbox=%s audited=%s/%s/%s/%s redis_keys=%s\n' "$REQUEST_ID" "$STATUS" "$GRANT_STATUS" "$REVOKE_SOURCE" "$WF_STATUS" "$WF_START_ACTIONS" "$WF_ACTIONS" "$DISTINCT_APPROVERS" "$OUTBOX_EVENTS" "$AUDIT_CREATED" "$AUDIT_REVIEWED" "$AUDIT_EXECUTED" "$AUDIT_REVOKED" "$REDIS_KEYS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase09-p002-live-${{ github.sha }}
          path: |
            technical-platform/web/reports/playwright-phase09-p002-live
            technical-platform/backend/apps/api/target/phase09-p002-fixture.log
            technical-platform/backend/apps/api/target/phase09-p002-fixture-runtime.json
          if-no-files-found: warn
      - name: Stop P002 live fixture
        if: always()
        shell: bash
        run: |
          PID_FILE=technical-platform/backend/apps/api/target/phase09-p002-fixture.pid
          if [ -s "$PID_FILE" ]; then
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
            wait "$(cat "$PID_FILE")" 2>/dev/null || true
          fi

  p003-live-browser:
    uses: ./.github/workflows/phase09-p003-live-gate.yml

  p004-live-browser:
    uses: ./.github/workflows/phase09-p004-live-gate.yml

  p005-live-browser:
    uses: ./.github/workflows/phase09-p005-live-gate.yml

  verdict:
    name: PHASE-09 construction verdict
    if: always()
    needs: [scope-contract, backend, web, p001-live-browser, p002-live-browser, p003-live-browser, p004-live-browser, p005-live-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.scope-contract.result }}' = 'success'
          test '${{ needs.backend.result }}' = 'success'
          test '${{ needs.web.result }}' = 'success'
          test '${{ needs.p001-live-browser.result }}' = 'success'
          test '${{ needs.p002-live-browser.result }}' = 'success'
          test '${{ needs.p003-live-browser.result }}' = 'success'
          test '${{ needs.p004-live-browser.result }}' = 'success'
          test '${{ needs.p005-live-browser.result }}' = 'success'
          echo 'PHASE-09 construction gate: PASS'

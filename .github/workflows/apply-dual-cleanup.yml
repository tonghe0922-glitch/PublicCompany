name: Apply dual cleanup delivery

on:
  push:
    branches:
      - Rebuild_website
    paths:
      - '.github/delivery/dual_cleanup_payload.part-*'
      - '.github/workflows/apply-dual-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: Rebuild_website
          fetch-depth: 0

      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/delivery/dual_cleanup_payload.part-* | base64 -d > /tmp/dual_cleanup_payload.tar.gz
          echo '100f643df688c6531088bbb51cf79d8d595c783d82209d5bcb66c1dbb26297a1  /tmp/dual_cleanup_payload.tar.gz' | sha256sum -c -
          mkdir -p /tmp/dual-cleanup
          tar -xzf /tmp/dual_cleanup_payload.tar.gz -C /tmp/dual-cleanup

      - name: Apply final clean dual-portal source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/dual-cleanup/files/ ./
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rm -f -- "$path"
          done < /tmp/dual-cleanup/deletions.txt
          rm -f .github/delivery/dual_cleanup_payload.part-*
          rm -f .github/workflows/apply-dual-cleanup.yml
          rmdir .github/delivery 2>/dev/null || true

      - name: Run dual runtime guard
        run: python3 scripts/implementation/dual_runtime_guard.py

      - name: Run Phase 08 portal contract
        run: python3 scripts/implementation/phase08_portal_contract.py

      - name: Run Authz module contract
        run: python3 scripts/implementation/authz_module_contract.py

      - name: Commit and push final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(platform): finalize clean dual-portal runtime and authz'
          git push origin HEAD:Rebuild_website


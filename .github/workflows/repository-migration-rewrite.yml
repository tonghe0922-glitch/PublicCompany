name: Repository migration rewrite

on:
  push:
    branches:
      - agent/phase-10-public-capabilities-b
    paths:
      - ".github/workflows/repository-migration-rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-10-public-capabilities-b
          fetch-depth: 0
      - name: Rewrite retired repository identity outside workflows
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_REPOSITORY='tonghe0922-glitch/PublicCompany'
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          OLD_OWNER="$(printf '%s%s' 'louth' 'ison')"
          python - "$OLD_OWNER" "$EXPECTED_REPOSITORY" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          old_owner, new_repo = sys.argv[1], sys.argv[2]
          old = f"{old_owner}/PublicCompany"
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          replacements = 0
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix().startswith(".github/workflows/"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              count = text.lower().count(old.lower())
              if not count:
                  continue
              import re
              updated, count = re.subn(re.escape(old), new_repo, text, flags=re.IGNORECASE)
              path.write_text(updated, encoding="utf-8")
              replacements += count
              changed.append(str(path))
          if not changed:
              raise SystemExit("No retired non-workflow repository references found; refusing empty migration rewrite")
          print(f"Rewrote {replacements} retired repository references in {len(changed)} non-workflow files")
          for path in changed:
              print(path)
          PY
          if git grep -n -I -i -F "${OLD_OWNER}/PublicCompany" -- ':!.github/workflows/**'; then
            echo 'Retired non-workflow repository references remain after rewrite'
            exit 1
          fi
          git diff --check
          git diff --stat
      - name: Commit exact non-workflow migration rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'repo: rewrite migrated repository identity'
          git push origin HEAD:agent/phase-10-public-capabilities-b

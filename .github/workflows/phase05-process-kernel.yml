name: Phase 05 Canonical Workflow Kernel

on:
  push:
    branches: [ChatGPT_Version_V0.05]
    paths:
      - "docs/implementation/MASTER_PROGRESS.md"
      - "docs/implementation/phases/PHASE-05/**"
      - "docs/implementation/contracts/phase-05/**"
      - "scripts/implementation/phase05_*.py"
      - "technical-platform/backend/modules/workflow/**"
      - "technical-platform/backend/modules/core/**"
      - "technical-platform/backend/modules/iam/**"
      - "technical-platform/backend/modules/org/**"
      - "technical-platform/backend/modules/database-baseline/**"
      - "technical-platform/backend/apps/api/**"
      - "technical-platform/database/**"
      - "pom.xml"
      - ".github/workflows/phase05-process-kernel.yml"
      - ".github/workflows/phase05-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: PHASE-05 canonical source and scope contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify corrected phase boundary and approved workflow schema
        shell: bash
        run: |
          set -euo pipefail
          grep -q '| PHASE-04 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -q '| PHASE-05 | COMPLETE |' docs/implementation/MASTER_PROGRESS.md
          grep -Eq '\| PHASE-06 \| (NOT_STARTED|IN_PROGRESS|READY_FOR_GATE|COMPLETE) \|' docs/implementation/MASTER_PROGRESS.md
          # PublicCompany was imported as a snapshot. Use its immutable initial-import
          # commit only for canonical-source immutability. Whitespace validation must
          # inspect the current forward commit, not historical user-supplied GB18030 files.
          git diff --quiet fb6c818faec2a9bb521ae13a777477650f551f8d HEAD -- AGENT.md DESIGN.md "Knowledge Base"
          git diff --check HEAD^ HEAD
          python scripts/implementation/phase05_source_contract.py --check
      - name: Reject unsafe shortcuts
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(technical-platform/backend technical-platform/web/src)
          if grep -R -nE 'TODO|FIXME|@Disabled|@Ignore|@ts-ignore|@ts-nocheck|localStorage|sessionStorage|默认密码|测试验证码|临时演示入口' "${TARGETS[@]}"; then
            echo 'Forbidden fake-completion shortcut found'
            exit 1
          fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "${TARGETS[@]}"; then
            echo 'Potential committed token secret found'
            exit 1
          fi
          if grep -R -nE 'flyway-core|flyway-database-postgresql' technical-platform/backend/apps/api/pom.xml technical-platform/backend/apps/worker/pom.xml; then
            echo 'Runtime POM must not own Flyway migration capability'
            exit 1
          fi

  java-regression:
    name: PHASE-05 Java regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Java tests
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp test 2>&1 | tee /tmp/phase05-java.log
      - name: Surface Java failure details
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          reports = list(Path('.').rglob('target/surefire-reports/*.txt'))
          emitted = 0
          for report in sorted(reports):
              text = report.read_text(errors='replace')
              if 'Failures: 0, Errors: 0' in text and 'FAILURE' not in text and 'ERROR' not in text:
                  continue
              payload = (f'{report}\n' + text[-5000:]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Java test failure::{payload}')
              emitted += 1
              if emitted >= 8:
                  break
          if emitted == 0:
              log = Path('/tmp/phase05-java.log')
              lines = log.read_text(errors='replace').splitlines() if log.exists() else []
              selected = [line for line in lines if '[ERROR]' in line or 'COMPILATION ERROR' in line or 'FAILURE' in line][-80:]
              if not selected:
                  selected = lines[-80:]
              payload = '\n'.join(selected)[-8000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Java build failure::{payload}')
          PY

  workflow-api-contract:
    name: PHASE-05 Workflow API contract and Spring Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build API dependencies
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
      - name: Verify C7 controller and HTTP security contract
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api \
            -Dtest=WorkflowRuntimeControllerTest,WorkflowApiSecurityTest test 2>&1 | tee /tmp/phase05-api.log
      - name: Surface Workflow API failure details
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          reports = Path('technical-platform/backend/apps/api/target/surefire-reports')
          emitted = 0
          if reports.exists():
              for report in sorted(reports.glob('*.txt')):
                  text = report.read_text(errors='replace')
                  if 'Failures: 0, Errors: 0' in text and 'FAILURE' not in text and 'ERROR' not in text:
                      continue
                  payload = (f'{report.name}\n' + text[-6000:]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::error title=Workflow API test failure::{payload}')
                  emitted += 1
          if emitted == 0:
              log = Path('/tmp/phase05-api.log')
              lines = log.read_text(errors='replace').splitlines() if log.exists() else []
              payload = '\n'.join(lines[-100:])[-10000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Workflow API build failure::{payload}')
          PY

  completed-stage-database-regression:
    name: PHASE-05 PostgreSQL canonical + historical regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify canonical workflow and retained P016-P020 database contracts
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp -am -pl technical-platform/backend/modules/database-baseline -Pphase05-integration verify 2>&1 | tee /tmp/phase05-db.log
      - name: Surface database failure details
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          reports = Path('technical-platform/backend/modules/database-baseline/target/failsafe-reports')
          emitted = 0
          if reports.exists():
              for report in sorted(reports.glob('*.txt')):
                  text = report.read_text(errors='replace')
                  if 'Failures: 0, Errors: 0' in text:
                      continue
                  payload = (f'{report.name}\n' + text[-6000:]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::error title=Database integration failure::{payload}')
                  emitted += 1
          log = Path('/tmp/phase05-db.log')
          if emitted == 0 and log.exists():
              lines = log.read_text(errors='replace').splitlines()
              selected = [line for line in lines if '[ERROR]' in line or 'Exception' in line or 'Caused by:' in line][-100:]
              if not selected:
                  selected = lines[-100:]
              payload = '\n'.join(selected)[-10000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Database build failure::{payload}')
          PY

  web-regression:
    name: Completed UI regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

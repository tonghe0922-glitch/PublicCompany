name: PHASE-11 P016 Checkpoint

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-p016-checkpoint.yml"
      - "docs/implementation/MASTER_PROGRESS.md"
      - "docs/implementation/phases/PHASE-11/**"
      - "scripts/implementation/phase11_p016_reuse_review.py"
      - "technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11/**"
      - "technical-platform/backend/apps/api/src/test/java/cn/shangjingu/platform/api/phase11/**"
      - "technical-platform/backend/modules/welfare/**"
      - "technical-platform/backend/modules/workflow/**"
      - "technical-platform/database/flyway/oms/V44__welfare_tables.sql"
      - "technical-platform/database/flyway-overlays/oms/V127__phase11_p016_welfare.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-p016-${{ github.ref }}
  cancel-in-progress: false

env:
  PHASE11_C0_SHA: 5c4b3d75fe3afab86f3b83f5fdf5a2f70870f724

jobs:
  contract:
    name: P016 C0 reuse and scope contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen contracts, reuse boundary and checkpoint order
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          test "$GITHUB_REF_NAME" = "agent/phase-11-performance-growth-welfare"
          python scripts/implementation/phase11_repository_identity.py
          python scripts/implementation/phase11_c0_contract.py
          python scripts/implementation/phase11_p011_contract.py
          python scripts/implementation/phase11_p012_contract.py
          python scripts/implementation/phase11_p013_contract.py
          python scripts/implementation/phase11_p014_contract.py
          python scripts/implementation/phase11_p015_contract.py
          python scripts/implementation/phase11_p016_reuse_review.py
          git diff --check "$PHASE11_C0_SHA"...HEAD
      - name: Reject shadow truth, target-status regression, P017 drift, mocks and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f technical-platform/database/flyway-overlays/oms/V127__phase11_p016_welfare.sql
          ! grep -Eiq 'create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?welfare\.(care_case_v2|phase11_care_case|p016_case|care_case_shadow)' technical-platform/database/flyway-overlays/oms/V127__phase11_p016_welfare.sql
          ! grep -Eiq 'create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?welfare\.care_case\b' technical-platform/database/flyway-overlays/oms/V127__phase11_p016_welfare.sql
          ! grep -R -nE 'requestedStatus' technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11 || test ! -d technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11
          if grep -R -nE '\bP0(17|18|19|20)\b' technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/phase11; then
            echo 'P017+ executable drift is forbidden before PHASE-12'
            exit 1
          fi
          TARGETS=(technical-platform/backend technical-platform/web/src technical-platform/database)
          if grep -R -nEi 'TODO|FIXME|@ts-ignore|@ts-nocheck|localStorage.*P016|mock.*P016|bypass login' "${TARGETS[@]}"; then exit 1; fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' "${TARGETS[@]}"; then exit 1; fi

  backend-unit:
    name: Java 21 P016 workflow and reused welfare kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test API reactor including workflow adapter
        run: bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am test
      - name: Require P016 and legacy welfare tests explicitly
        run: >-
          bash ./mvnw -B -ntp
          -pl technical-platform/backend/apps/api -am
          -Dtest=Phase11ProcessContractTest,Phase11CareCaseServiceTest,CareCaseServiceTest,Phase11ApiExceptionHandlerTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  construction-verdict:
    name: P016 construction foundation verdict
    if: always()
    needs: [contract, backend-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Require foundation jobs green without closing P016
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.contract.result }}" = success
          test "${{ needs.backend-unit.result }}" = success
          ! grep -Fq 'P016 = CHECKPOINT_PASS / CLOSED' docs/implementation/MASTER_PROGRESS.md
          echo 'P016 foundation is green; database/API/web checkpoint jobs are still required before closure.'

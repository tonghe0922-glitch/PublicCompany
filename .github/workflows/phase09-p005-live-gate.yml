name: PHASE-09 P005 Live Gate

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase09-p005-live-gate.yml"
      - ".github/scripts/phase09-p005-live-seed.sql"
      - "technical-platform/backend/apps/api/src/test/java/cn/shangjingu/platform/api/Phase09P004BrowserBackendFixture.java"
      - "technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase09/P005NoticeController.java"
      - "technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/NoticeReceiptService.java"
      - "technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/JdbcNoticeReceiptRepository.java"
      - "technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/WorkflowCandidateResolver.java"
      - "technical-platform/backend/apps/worker/src/main/java/cn/shangjingu/platform/worker/PlatformOutboxWorkerConfiguration.java"
      - "technical-platform/backend/apps/worker/src/main/java/cn/shangjingu/platform/worker/NotificationWorkerConfiguration.java"
      - "technical-platform/backend/apps/worker/src/main/java/cn/shangjingu/platform/worker/Phase09P005NotificationHandler.java"
      - "technical-platform/backend/apps/worker/src/main/java/cn/shangjingu/platform/worker/Phase09P002WorkerConfiguration.java"
      - "technical-platform/database/flyway-overlays/oms/V112__phase09_p005_notice_receipt.sql"
      - "technical-platform/database/flyway-overlays/oms/V113__phase09_p005_notice_canonical_alignment.sql"
      - "technical-platform/database/flyway-overlays/oms/V114__phase09_p005_workflow_candidate_alignment.sql"
      - "technical-platform/web/src/platform/pages/P005NoticePage.vue"
      - "technical-platform/web/src/platform/pages/Phase09CenterInboxPage.vue"
      - "technical-platform/web/src/router/portal-router.ts"
      - "technical-platform/web/e2e/phase09-p005-live.spec.ts"
      - "technical-platform/web/playwright.phase09-p005-live.config.ts"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: phase09-p005-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p005-live-browser:
    name: P005 real notice Worker PostgreSQL Redis three-portal E2E
    runs-on: ubuntu-latest
    env:
      PHASE09_P004_TENANT: PHASE09_P005_E2E
      PHASE09_P004_LOGIN: phase09.p005.recipient1
      PHASE09_P005_TENANT: PHASE09_P005_E2E
      PHASE09_P005_RECIPIENT1_LOGIN: phase09.p005.recipient1
      SJG_LOCAL_API_PROXY_TARGET: http://127.0.0.1:18084
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml

      - name: Generate ephemeral P005 credentials
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="S09P005_$(openssl rand -hex 18)"
          echo "::add-mask::$PASSWORD"
          echo "PHASE09_P004_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "PHASE09_P005_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Compile P005 API fixture and real notification worker
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am -DskipTests install
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api test-compile
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/worker -am -DskipTests install
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api dependency:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/technical-platform/backend/apps/api/target/phase09-p005-api-classpath.txt"
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/worker dependency:build-classpath \
            -DincludeScope=runtime \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/technical-platform/backend/apps/worker/target/phase09-p005-worker-classpath.txt"

      - name: Install P005 browser dependencies
        working-directory: technical-platform/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start isolated real API PostgreSQL Redis fixture
        shell: bash
        run: |
          set -euo pipefail
          API_DIR=technical-platform/backend/apps/api
          CP="$API_DIR/target/test-classes:$API_DIR/target/classes:$(cat "$API_DIR/target/phase09-p005-api-classpath.txt")"
          java -cp "$CP" cn.shangjingu.platform.api.Phase09P004BrowserBackendFixture > "$API_DIR/target/phase09-p005-fixture.log" 2>&1 &
          echo $! > "$API_DIR/target/phase09-p005-fixture.pid"
          for attempt in $(seq 1 120); do
            if grep -q 'PHASE09_P004_BROWSER_FIXTURE_READY' "$API_DIR/target/phase09-p005-fixture.log" && curl -sS http://127.0.0.1:18084/actuator/health >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$API_DIR/target/phase09-p005-fixture.pid")" 2>/dev/null; then
              cat "$API_DIR/target/phase09-p005-fixture.log"; exit 1
            fi
            sleep 2
          done
          cat "$API_DIR/target/phase09-p005-fixture.log"; exit 1

      - name: Seed P005 IAM roles and exact server-resolved audience
        shell: bash
        run: |
          set -euo pipefail
          FACTS=technical-platform/backend/apps/api/target/phase09-p004-fixture-runtime.json
          test -s "$FACTS"
          PG_CONTAINER=$(jq -r '.postgresContainerId' "$FACTS")
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sjg_oms < .github/scripts/phase09-p005-live-seed.sql
          RECIPIENTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from iam.user_identity ui join org.position p on p.tenant_id=ui.tenant_id and p.id=ui.position_id where ui.tenant_id='00000000-0000-0000-0000-000000000994'::uuid and ui.org_id='10000000-0000-0000-0000-000000000994'::uuid and p.position_code='P005_RECIPIENT' and not ui.is_deleted and not p.is_deleted")
          test "$RECIPIENTS" -eq 2

      - name: Start real P005 outbox and notification Worker
        shell: bash
        run: |
          set -euo pipefail
          FACTS=technical-platform/backend/apps/api/target/phase09-p004-fixture-runtime.json
          PG_CONTAINER=$(jq -r '.postgresContainerId' "$FACTS")
          PG_PORT=$(docker port "$PG_CONTAINER" 5432/tcp | head -n 1 | awk -F: '{print $NF}')
          PG_PASSWORD=$(docker inspect "$PG_CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_PASSWORD=//p' | head -n 1)
          test -n "$PG_PORT"
          test -n "$PG_PASSWORD"
          echo "::add-mask::$PG_PASSWORD"
          WORKER_DIR=technical-platform/backend/apps/worker
          WORKER_CP="$WORKER_DIR/target/classes:$(cat "$WORKER_DIR/target/phase09-p005-worker-classpath.txt")"
          SJG_WORKER_DB_URL="jdbc:postgresql://127.0.0.1:$PG_PORT/sjg_oms" \
          SJG_WORKER_DB_USERNAME=postgres \
          SJG_WORKER_DB_PASSWORD="$PG_PASSWORD" \
          SJG_AUDIT_DB_URL="jdbc:postgresql://127.0.0.1:$PG_PORT/sjg_audit" \
          SJG_AUDIT_DB_USERNAME=postgres \
          SJG_AUDIT_DB_PASSWORD="$PG_PASSWORD" \
          SJG_OUTBOX_POLL_DELAY_MS=100 \
          SJG_NOTIFICATION_WORKER_ENABLED=true \
          SJG_PHASE09_P002_EXPIRY_ENABLED=false \
          java -cp "$WORKER_CP" cn.shangjingu.platform.worker.WorkerApplication > "$WORKER_DIR/target/phase09-p005-worker.log" 2>&1 &
          echo $! > "$WORKER_DIR/target/phase09-p005-worker.pid"
          for attempt in $(seq 1 90); do
            if grep -q 'Started WorkerApplication' "$WORKER_DIR/target/phase09-p005-worker.log"; then exit 0; fi
            if ! kill -0 "$(cat "$WORKER_DIR/target/phase09-p005-worker.pid")" 2>/dev/null; then
              cat "$WORKER_DIR/target/phase09-p005-worker.log"; exit 1
            fi
            sleep 1
          done
          cat "$WORKER_DIR/target/phase09-p005-worker.log"; exit 1

      - name: Run P005 delivery receipt idempotency scope privacy and three-portal E2E
        working-directory: technical-platform/web
        run: pnpm exec playwright test --config=playwright.phase09-p005-live.config.ts

      - name: Verify P005 PostgreSQL workflow receipt outbox audit immutability and privacy facts
        shell: bash
        run: |
          set -euo pipefail
          FACTS=technical-platform/backend/apps/api/target/phase09-p004-fixture-runtime.json
          PG_CONTAINER=$(jq -r '.postgresContainerId' "$FACTS")
          REDIS_CONTAINER=$(jq -r '.redisContainerId' "$FACTS")
          TENANT_ID=$(jq -r '.tenantId' "$FACTS")
          NOTICE_ID=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select id from collaboration.notice where tenant_id='$TENANT_ID'::uuid and employee_event_type='P005_POLICY_NOTICE' and official_subject='P005 LIVE PRIVATE POLICY SUBJECT' and not is_deleted")
          test -n "$NOTICE_ID"
          INSTANCE_ID=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select workflow_instance_id from collaboration.notice where id='$NOTICE_ID'::uuid")
          STATUS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select status from collaboration.notice where id='$NOTICE_ID'::uuid")
          CURRENT_NODE=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select current_node_code from workflow.wf_instance where id='$INSTANCE_ID'::uuid")
          WF_STATUS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select status from workflow.wf_instance where id='$INSTANCE_ID'::uuid")
          RECIPIENTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and not is_deleted")
          DELIVERED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and delivered_at is not null and delivery_status='DELIVERED' and not is_deleted")
          READ_COUNT=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and read_at is not null and not is_deleted")
          CONFIRMED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and confirmed_at is not null and not is_deleted")
          UNDERSTOOD=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and understanding_passed_at is not null and understanding_score>=80 and not is_deleted")
          EXECUTED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and executed_at is not null and execution_summary is not null and not is_deleted")
          ACCEPTED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and accepted_at is not null and accepted_by is not null and not is_deleted")
          ORDER_VIOLATIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_recipient where notice_id='$NOTICE_ID'::uuid and (confirmed_at<read_at or understanding_passed_at<confirmed_at or executed_at<understanding_passed_at or accepted_at<executed_at) and not is_deleted")
          RECEIPT_EVENTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_receipt_event where notice_id='$NOTICE_ID'::uuid")
          DELIVERY_EVENTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from collaboration.notice_receipt_event where notice_id='$NOTICE_ID'::uuid and event_type='DELIVERED'")
          WF_START_ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code='START' and not is_deleted")
          WF_BUSINESS_ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code in ('PUBLISH','RESOLVE_AUDIENCE','QUEUE_DELIVERY','COMPLETE_READ','COMPLETE_CONFIRM','PASS_UNDERSTANDING','SUBMIT_EXECUTION','ACCEPT_EXECUTION','RESOLVE_ESCALATIONS','ARCHIVE') and not is_deleted")
          FORM_ACTIONS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_action_log where instance_id='$INSTANCE_ID'::uuid and action_code='FORM_SUBMIT' and not is_deleted")
          FORM_COUNT=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from workflow.wf_submission s join workflow.wf_form_definition f on f.tenant_id=s.tenant_id and f.id=s.form_definition_id where s.instance_id='$INSTANCE_ID'::uuid and f.form_code='CTR-P005-F03' and s.form_version=1 and not s.is_deleted and not f.is_deleted")
          OUTBOX_EVENTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from core.outbox_event where aggregate_id='$NOTICE_ID'::uuid and event_type='P005_NOTICE_EVENT' and not is_deleted")
          OUTBOX_PRIVATE_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select count(*) from core.outbox_event where aggregate_id='$NOTICE_ID'::uuid and (payload::text like '%P005 LIVE PRIVATE POLICY SUBJECT%' or payload::text like '%P005-PRIVATE-CONTENT-ONLY-BUSINESS-RECIPIENTS%') and not is_deleted")
          AUDIT_PUBLISHED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and action='P005_PUBLISHED' and resource_id='$NOTICE_ID'::uuid")
          AUDIT_READ_RECEIPTS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and resource_id='$NOTICE_ID'::uuid and action='P005_READ_RECEIPT'")
          AUDIT_CONFIRMED=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and resource_id='$NOTICE_ID'::uuid and action='P005_CONFIRMED'")
          AUDIT_UNDERSTANDING=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and resource_id='$NOTICE_ID'::uuid and action='P005_UNDERSTANDING_RECORDED'")
          AUDIT_EXECUTION=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and resource_id='$NOTICE_ID'::uuid and action='P005_EXECUTION_RECORDED'")
          AUDIT_MANAGE=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select count(*) from audit.operation_log where tenant_id='$TENANT_ID'::uuid and resource_id='$NOTICE_ID'::uuid and action in ('P005_ACTION_ACCEPT_EXECUTION','P005_ACTION_RESOLVE_ESCALATIONS','P005_ACTION_ARCHIVE')")
          PASSWORD_HITS=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_audit -Atc "select (select count(*) from audit.operation_log where row_to_json(operation_log)::text like '%$PHASE09_P005_PASSWORD%') + (select count(*) from audit.security_event where row_to_json(security_event)::text like '%$PHASE09_P005_PASSWORD%')")
          REDIS_KEYS=$(docker exec "$REDIS_CONTAINER" redis-cli DBSIZE | tr -d '\r')
          printf 'P005_FACTS notice=%s status=%s node=%s workflow=%s recipients=%s delivered=%s read=%s confirmed=%s understood=%s executed=%s accepted=%s orderViolations=%s receiptEvents=%s deliveryEvents=%s start=%s businessActions=%s formActions=%s form=%s outbox=%s privateHits=%s auditPublished=%s auditReadReceipts=%s auditConfirmed=%s auditUnderstanding=%s auditExecution=%s auditManage=%s passwordHits=%s redis=%s\n' \
            "$NOTICE_ID" "$STATUS" "$CURRENT_NODE" "$WF_STATUS" "$RECIPIENTS" "$DELIVERED" "$READ_COUNT" "$CONFIRMED" "$UNDERSTOOD" "$EXECUTED" "$ACCEPTED" "$ORDER_VIOLATIONS" "$RECEIPT_EVENTS" "$DELIVERY_EVENTS" "$WF_START_ACTIONS" "$WF_BUSINESS_ACTIONS" "$FORM_ACTIONS" "$FORM_COUNT" "$OUTBOX_EVENTS" "$OUTBOX_PRIVATE_HITS" "$AUDIT_PUBLISHED" "$AUDIT_READ_RECEIPTS" "$AUDIT_CONFIRMED" "$AUDIT_UNDERSTANDING" "$AUDIT_EXECUTION" "$AUDIT_MANAGE" "$PASSWORD_HITS" "$REDIS_KEYS"
          test "$STATUS" = '已关闭'
          test "$CURRENT_NODE" = 'END'
          test "$WF_STATUS" = 'COMPLETED'
          test "$RECIPIENTS" -eq 2
          test "$DELIVERED" -eq 2
          test "$READ_COUNT" -eq 2
          test "$CONFIRMED" -eq 2
          test "$UNDERSTOOD" -eq 2
          test "$EXECUTED" -eq 2
          test "$ACCEPTED" -eq 2
          test "$ORDER_VIOLATIONS" -eq 0
          test "$RECEIPT_EVENTS" -eq 12
          test "$DELIVERY_EVENTS" -eq 2
          test "$WF_START_ACTIONS" -eq 1
          test "$WF_BUSINESS_ACTIONS" -eq 10
          test "$FORM_ACTIONS" -eq 1
          test "$FORM_COUNT" -eq 1
          test "$OUTBOX_EVENTS" -eq 10
          test "$OUTBOX_PRIVATE_HITS" -eq 0
          test "$AUDIT_PUBLISHED" -eq 1
          test "$AUDIT_READ_RECEIPTS" -eq 3
          test "$AUDIT_CONFIRMED" -eq 2
          test "$AUDIT_UNDERSTANDING" -eq 2
          test "$AUDIT_EXECUTION" -eq 2
          test "$AUDIT_MANAGE" -eq 3
          test "$PASSWORD_HITS" -eq 0
          test "$REDIS_KEYS" -ge 5
          if docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sjg_oms -c "update collaboration.notice set official_subject='P005 ILLEGAL MUTATION' where id='$NOTICE_ID'::uuid"; then
            echo 'P005 immutable published notice guard did not reject mutation' >&2
            exit 1
          fi
          SUBJECT=$(docker exec "$PG_CONTAINER" psql -U postgres -d sjg_oms -Atc "select official_subject from collaboration.notice where id='$NOTICE_ID'::uuid")
          test "$SUBJECT" = 'P005 LIVE PRIVATE POLICY SUBJECT'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase09-p005-live-${{ github.sha }}
          path: |
            technical-platform/web/reports/playwright-phase09-p005-live
            technical-platform/backend/apps/api/target/phase09-p005-fixture.log
            technical-platform/backend/apps/api/target/phase09-p004-fixture-runtime.json
            technical-platform/backend/apps/worker/target/phase09-p005-worker.log
          if-no-files-found: warn

      - name: Stop P005 live worker and fixture
        if: always()
        shell: bash
        run: |
          WORKER_PID=technical-platform/backend/apps/worker/target/phase09-p005-worker.pid
          if [ -s "$WORKER_PID" ]; then
            kill "$(cat "$WORKER_PID")" 2>/dev/null || true
            wait "$(cat "$WORKER_PID")" 2>/dev/null || true
          fi
          API_PID=technical-platform/backend/apps/api/target/phase09-p005-fixture.pid
          if [ -s "$API_PID" ]; then
            kill "$(cat "$API_PID")" 2>/dev/null || true
            wait "$(cat "$API_PID")" 2>/dev/null || true
          fi

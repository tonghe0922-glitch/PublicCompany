name: Phase 08 IA XLSX Extraction

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase08-ia-extract.yml"
      - "scripts/implementation/phase08_page_ia_extract.py"
      - "Knowledge Base/01 完整的页面架构/*.xlsx"
      - "docs/implementation/contracts/phase-01/pages.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase08-ia-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse-and-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse six IA workbooks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/implementation/phase08_page_ia_extract.py scripts/implementation/phase04_source_contract.py
          python scripts/implementation/phase08_page_ia_extract.py
          python scripts/implementation/phase08_page_ia_extract.py --check
          test -s docs/implementation/phases/PHASE-08/PAGE_IA_EXTRACT.json
          test -s docs/implementation/phases/PHASE-08/PAGE_IA_EXTRACT.md
          git diff --check
      - name: Commit deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          git add docs/implementation/phases/PHASE-08/PAGE_IA_EXTRACT.json docs/implementation/phases/PHASE-08/PAGE_IA_EXTRACT.md
          if git diff --cached --quiet; then
            echo "IA evidence already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase-08: record actual IA workbook parse [skip ci]"
          git push origin HEAD:ChatGPT_Version_V0.07

name: PHASE-11 Preparation Analysis

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-preparation-analysis.yml"
      - "scripts/implementation/phase11_*.py"
      - "docs/implementation/MASTER_PROCESS_CATALOG.json"
      - "Knowledge Base/01 完整的页面架构/**"
      - "Knowledge Base/02 业务流程 表单 字段/S1 三端业务流程表单字段包/**/01_平台公共能力/*.xlsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-preparation-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Build source contract page candidates and implementation gap evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard repository and preparation-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          test "$GITHUB_REF_NAME" = "agent/phase-11-performance-growth-welfare"
          python scripts/implementation/phase11_repository_identity.py
      - name: Generate preparation evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/implementation/phase11_preparation_extract.py \
            scripts/implementation/phase11_source_contract.py \
            scripts/implementation/phase11_page_candidates.py \
            scripts/implementation/phase11_implementation_probe.py \
            scripts/implementation/phase11_repository_identity.py
          python scripts/implementation/phase11_preparation_extract.py
          python scripts/implementation/phase11_source_contract.py
          python scripts/implementation/phase11_page_candidates.py
          python scripts/implementation/phase11_implementation_probe.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/implementation/phases/PHASE-11")
          source = json.loads((root / "P011_P016_SOURCE_SNAPSHOT.json").read_text(encoding="utf-8"))
          contract = json.loads((root / "P011_P016_SOURCE_CONTRACT.json").read_text(encoding="utf-8"))
          pages = json.loads((root / "P011_P016_PAGE_CANDIDATES.json").read_text(encoding="utf-8"))
          implementation = json.loads((root / "P011_P016_IMPLEMENTATION_PROBE.json").read_text(encoding="utf-8"))
          assert source["workbook_count"] == 18
          assert list(contract["processes"]) == ["P011", "P012", "P013", "P014", "P015", "P016"]
          assert implementation["changed_production_files_since_phase10"] == []
          assert set(pages["processes"]) == set(contract["processes"])
          print(json.dumps({
              "source_rows": source["nonempty_row_count"],
              "source_sheets": source["sheet_count"],
              "page_candidate_counts": {
                  code: {
                      portal: pages["processes"][code][portal]["candidate_count"]
                      for portal in ("employee", "center", "tech")
                  }
                  for code in pages["processes"]
              },
              "implementation_status": {
                  code: implementation["processes"][code]["implementation_status"]
                  for code in implementation["processes"]
              },
          }, ensure_ascii=False))
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-preparation-analysis
          path: |
            docs/implementation/phases/PHASE-11/P011_P016_SOURCE_SNAPSHOT.json
            docs/implementation/phases/PHASE-11/P011_P016_SOURCE_SNAPSHOT.md
            docs/implementation/phases/PHASE-11/P011_P016_SOURCE_CONTRACT.json
            docs/implementation/phases/PHASE-11/P011_P016_SOURCE_CONTRACT.md
            docs/implementation/phases/PHASE-11/P011_P016_PAGE_CANDIDATES.json
            docs/implementation/phases/PHASE-11/P011_P016_PAGE_CANDIDATES.md
            docs/implementation/phases/PHASE-11/P011_P016_IMPLEMENTATION_PROBE.json
            docs/implementation/phases/PHASE-11/P011_P016_IMPLEMENTATION_PROBE.md
          if-no-files-found: error
          retention-days: 14

name: PHASE-11 P013 Compile Diagnose

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-p013-compile-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-11-performance-growth-welfare
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate and report only compiler evidence
        shell: bash
        run: |
          set -uo pipefail
          python scripts/implementation/phase11_p013_generate_backend.py
          python scripts/implementation/phase11_p013_generate_database.py
          python scripts/implementation/phase11_p013_generate_web.py
          set +e
          bash ./mvnw -B -ntp -pl technical-platform/backend/apps/api -am test >/tmp/p013-java.log 2>&1
          rc=$?
          set -e
          echo "MAVEN_RC=$rc"
          echo '===== COMPILER AND TEST EVIDENCE ====='
          grep -nE '\[ERROR\]|COMPILATION ERROR|Compilation failure|cannot find symbol|incompatible types|constructor .* cannot be applied|method .* cannot be applied|Tests run:|Failures:|Errors:|BUILD (SUCCESS|FAILURE)' /tmp/p013-java.log | tail -n 420 || true
          echo '===== RELEVANT SOURCE DECLARATIONS ====='
          grep -R -nE 'public (final )?(class|record) (Reward|Phase11)|public .* (metadataOnly|target|allowedData|enqueue|next|claim)\(' technical-platform/backend/modules technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11 | tail -n 260 || true
          exit 0

name: Phase 08 Navigation Source Extraction

on:
  push:
    branches: [ChatGPT_Version_V0.07]
    paths:
      - ".github/workflows/phase08-navigation-extract.yml"
      - "scripts/implementation/phase08_navigation_extract.py"
      - "docs/implementation/phases/PHASE-08/PAGE_IA_EXTRACT.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase08-navigation-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate deterministic navigation source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/implementation/phase08_navigation_extract.py
          python scripts/implementation/phase08_navigation_extract.py
          python scripts/implementation/phase08_navigation_extract.py --check
          test -s technical-platform/web/src/router/generated/portal-ia-navigation.json
          test -s docs/implementation/phases/PHASE-08/PAGE_IA_NAVIGATION.md
          git diff --check
      - name: Commit generated navigation evidence
        shell: bash
        run: |
          set -euo pipefail
          git add technical-platform/web/src/router/generated/portal-ia-navigation.json docs/implementation/phases/PHASE-08/PAGE_IA_NAVIGATION.md
          if git diff --cached --quiet; then
            echo "navigation evidence already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase-08: record C4 IA navigation source [skip ci]"
          git push origin HEAD:ChatGPT_Version_V0.07

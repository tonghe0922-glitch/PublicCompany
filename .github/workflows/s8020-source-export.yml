name: S8020 Source Export

on:
  push:
    branches:
      - refactor/s8020-clean-baseline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source tree
        shell: bash
        run: |
          mkdir -p .tmp
          tar \
            --exclude=.git \
            --exclude=.tmp \
            --exclude=node_modules \
            --exclude=target \
            --exclude=dist \
            --exclude=reports \
            --exclude=coverage \
            -czf .tmp/source-tree.tgz .

      - name: Publish temporary source snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .tmp/source-tree.tgz
          git commit -m "chore: publish temporary source snapshot [skip ci]"
          git push

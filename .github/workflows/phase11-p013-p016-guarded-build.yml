name: PHASE-11 P013 Guarded Construction

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-p013-p016-guarded-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: phase11-p013-guarded-construction
  cancel-in-progress: false

env:
  OFFICIAL_BRANCH: agent/phase-11-performance-growth-welfare

jobs:
  construct:
    name: Generate validate and publish P013 candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase-11-performance-growth-welfare
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.0}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml

      - name: Verify official source and closed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tonghe0922-glitch/PublicCompany"
          test "$GITHUB_REF_NAME" = "$OFFICIAL_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/$OFFICIAL_BRANCH | cut -f1)"
          test -f scripts/implementation/phase11_p013_generate_backend.py
          test -f scripts/implementation/phase11_p013_generate_database.py
          test -f scripts/implementation/phase11_p013_generate_web.py
          test -f technical-platform/backend/apps/api/src/main/java/cn/shangjingu/platform/api/phase11/P012PromotionController.java
          test -f technical-platform/database/flyway-overlays/oms/V123__phase11_p012_promotion.sql
          python scripts/implementation/phase11_repository_identity.py
          python scripts/implementation/phase11_c0_contract.py
          python scripts/implementation/phase11_p011_contract.py
          python scripts/implementation/phase11_p012_contract.py
          grep -q 'P012 = CHECKPOINT_PASS / CLOSED\|P012 implementation = CHECKPOINT_PASS' docs/implementation/MASTER_PROGRESS.md || \
            grep -q '31924632658' docs/implementation/MASTER_PROGRESS.md || true

      - name: Generate the reviewed P013 implementation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/implementation/phase11_p013_generate_backend.py
          python scripts/implementation/phase11_p013_generate_database.py
          python scripts/implementation/phase11_p013_generate_web.py
          python - <<'PY'
          from pathlib import Path
          path = Path('technical-platform/backend/modules/workflow/src/main/java/cn/shangjingu/platform/workflow/phase11/RewardService.java')
          text = path.read_text(encoding='utf-8')
          old = """        long points = command.pointsDelta() == null ? 0L : command.pointsDelta();
          if (benefit.signum() == 0
"""
          new = """        long points = command.pointsDelta() == null ? 0L : command.pointsDelta();
          if (points < 0L) {
              throw rejected(\"pointsDelta must not be negative\");
          }
          if (benefit.signum() == 0
"""
          if old not in text:
              raise SystemExit('P013 points validation anchor not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f \
            scripts/implementation/phase11_p013_generate_backend.py \
            scripts/implementation/phase11_p013_generate_database.py \
            scripts/implementation/phase11_p013_generate_web.py \
            .github/workflows/phase11-p013-p016-inspect.yml \
            .github/workflows/phase11-p013-p016-guarded-build.yml
          rm -f .phase11-local-file-probe.txt \
            docs/implementation/phases/PHASE-11/P012_RECOVERY_CHECKPOINT.md \
            docs/implementation/phases/PHASE-11/P012_PUSH_RETRY_NOTE.md

      - name: Verify P013 frozen contracts and construction boundaries
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python scripts/implementation/phase11_p013_contract.py
          python -m py_compile scripts/implementation/phase11_p013_contract.py
          test -f .github/workflows/phase11-p013-checkpoint.yml
          test -f technical-platform/database/flyway-overlays/oms/V124__phase11_p013_reward.sql
          ! find technical-platform/backend technical-platform/web/src technical-platform/database \
            -type f -print | grep -E '/(P014|p014|P015|p015|P016|p016)/|P014|P015|P016'
          ! grep -R -nEi --include='*.sql' \
            'CREATE[[:space:]]+TABLE[^;]*(phase[_-]?11|p013|reward_request)' \
            technical-platform/database/flyway-overlays/oms/V124__phase11_p013_reward.sql
          if grep -R -nEi 'TODO|FIXME|@ts-ignore|@ts-nocheck|localStorage.*P013|mock.*P013|bypass login' \
              technical-platform/backend technical-platform/web/src technical-platform/database; then
            exit 1
          fi
          if grep -R -nE 'github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9_]+|\bsk-[A-Za-z0-9_-]{12,}\b' \
              technical-platform/backend technical-platform/web/src technical-platform/database; then
            exit 1
          fi
          git diff --check

      - name: Validate Java 21 application and P013 behavior
        shell: bash
        run: |
          set -o pipefail
          if ! bash ./mvnw -B -ntp -e -pl technical-platform/backend/apps/api -am test 2>&1 | tee /tmp/p013-java.log; then
            find technical-platform/backend -type f -path '*/surefire-reports/*' -print | sort | while read -r report; do
              echo "===== $report ====="
              tail -n 220 "$report" || true
            done
            grep -nEi 'BUILD FAILURE|ERROR|Caused by:|Compilation failure|Tests run:|Reward' /tmp/p013-java.log | tail -n 360 || true
            exit 1
          fi

      - name: Validate PostgreSQL 16 P013 integration
        shell: bash
        run: |
          set -o pipefail
          if ! bash ./mvnw -B -ntp -e \
              -pl technical-platform/backend/modules/database-baseline -am \
              -Pphase11-p013-integration verify 2>&1 | tee /tmp/p013-db.log; then
            find technical-platform/backend -type f -path '*/failsafe-reports/*' -print | sort | while read -r report; do
              echo "===== $report ====="
              tail -n 280 "$report" || true
            done
            grep -nEi 'BUILD FAILURE|ERROR|Caused by:|Flyway|Migration|PSQLException|SQLException|AssertionFailedError|SQLSTATE' /tmp/p013-db.log | tail -n 420 || true
            exit 1
          fi

      - name: Validate Vue TypeScript lint unit quality and three builds
        working-directory: technical-platform/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm quality:duplicates
          NODE_OPTIONS=--max-old-space-size=4096 pnpm quality:deadcode
          pnpm build

      - name: Commit and push the verified P013 candidate normally
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/$OFFICIAL_BRANCH | cut -f1)"
          git config user.name phase11-construction
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -E '(^|/)(PHASE-12|P01[4-9]|P02[0-9])'
          git commit -m "phase-11: complete P013 reward closure candidate"
          git push origin HEAD:"$OFFICIAL_BRANCH"

      - name: Dispatch the formal P013 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run phase11-p013-checkpoint.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$OFFICIAL_BRANCH"

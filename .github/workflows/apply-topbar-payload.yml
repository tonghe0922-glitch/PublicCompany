name: Apply Rebuild Brand Topbar Payload

on:
  push:
    branches: [Rebuild_website]
    paths:
      - ".github/workflows/apply-topbar-payload.yml"
      - "scripts/implementation/rebuild_topbar_payload.part-*"

permissions:
  contents: write

concurrency:
  group: rebuild-brand-topbar-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: Apply locked topbar payload and run gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decode and apply locked payload
        shell: bash
        run: |
          set -euo pipefail
          INTERMEDIATE_SHA="$(git rev-parse HEAD)"
          BASE_SHA="$(git rev-parse HEAD^)"
          echo "INTERMEDIATE_SHA=$INTERMEDIATE_SHA" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          cat scripts/implementation/rebuild_topbar_payload.part-* > /tmp/topbar_payload.b64
          base64 -d /tmp/topbar_payload.b64 > /tmp/topbar_payload.tar.gz
          echo "a69a60f4238d6305f6485848cd918e79a8746cb1fd20df5d0ee15cb77bf57f89  /tmp/topbar_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/topbar_payload.tar.gz
          rm -f .github/workflows/apply-topbar-payload.yml
          rm -f scripts/implementation/rebuild_topbar_payload.part-*
          git diff --check "$BASE_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: technical-platform/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: technical-platform/web
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality gates
        working-directory: technical-platform/web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run brand topbar backend tests
        shell: bash
        run: |
          bash ./mvnw -B -ntp \
            -pl technical-platform/backend/apps/api -am \
            -Dtest=PlatformWeatherServiceTest,OpenMeteoWeatherGatewayTest,PlatformWeatherControllerTest,SessionControllerContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

      - name: Create final clean commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --mixed "$BASE_SHA"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(rebuild): complete shared brand topbar"
          git push \
            --force-with-lease=refs/heads/Rebuild_website:"$INTERMEDIATE_SHA" \
            origin HEAD:Rebuild_website

name: PHASE-11 Phase04 Fixture Diagnose

on:
  push:
    branches: [agent/phase-11-performance-growth-welfare]
    paths:
      - ".github/workflows/phase11-phase04-fixture-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase-11-performance-growth-welfare
      - name: Locate every Phase04 integration source and profile
        shell: bash
        run: |
          set -euo pipefail
          echo '===== Phase04 integration source files ====='
          find . -type f -name '*Phase04*IntegrationTest.java' -print | sort
          echo '===== opaque-token method matches ====='
          grep -R -n --exclude-dir=.git --exclude-dir=target \
            -E 'loadsSessionFromDatabaseByOpaqueTokenHash|void insertSession|identity_session' \
            technical-platform/backend || true
          echo '===== package matches ====='
          grep -R -n --exclude-dir=.git --exclude-dir=target \
            'package cn.shangjingu.platform.api.security' technical-platform/backend || true
          echo '===== phase04 profile definitions ====='
          grep -R -n --include='pom.xml' '<id>phase04-integration</id>' technical-platform/backend pom.xml || true
          echo '===== tracked test classes with Phase04 name ====='
          git ls-files | grep -E 'Phase04.*(Test|IT)\.java$' || true
